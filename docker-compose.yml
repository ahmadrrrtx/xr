# XR — one-command run. Whole agent + dashboard in a container.
# Pairs with a local Ollama (host) for $0 local inference.
services:
  xr:
    build: .
    container_name: xr
    # The daemon binds 0.0.0.0 inside the container (otherwise the published
    # port cannot reach it); this mapping keeps it reachable ONLY from the
    # host's loopback, so the dashboard is never exposed to the network.
    ports:
      - "127.0.0.1:7842:7842"
    volumes:
      - xr-data:/data
    environment:
      # Tell XR it is containerised (also set in the image).
      - XR_IN_CONTAINER=1
      # BYO keys (optional) — local Ollama needs none.
      - XR_OLLAMA=${XR_OLLAMA:-http://host.docker.internal:11434}
      # - GROQ_API_KEY=...
      # - XR_TELEGRAM_TOKEN=...   XR_TELEGRAM_ALLOWED=...
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  xr-data:
