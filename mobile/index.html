<!doctype html>
<html lang="en" data-theme="xr-native">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to resolve on iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>XR</title>
    <meta name="description" content="XR — local-first AI companion. Your desktop, in your pocket." />
    <meta name="theme-color" content="#03070D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- iOS: standalone PWA, no Safari chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="XR" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/mobile/icons/apple-touch-icon-180.png" />
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-2048x2732.png"
      media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-1668x2388.png"
      media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/mobile/icons/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />

    <!--
      CSP (mirrored by the daemon as a response header in LAN mode).
      No third-party script, no CDN, no telemetry endpoint. connect-src allows
      only our own origin plus the browser-native Web Push services.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'; connect-src 'self' wss: https://*.googleapis.com https://*.push.apple.com https://updates.push.services.mozilla.com; worker-src 'self'; manifest-src 'self'; font-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: sans-serif; padding: 32px; color: #9aa8ba">
        XR needs JavaScript enabled to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
