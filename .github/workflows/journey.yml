# =============================================================================
# XR-LAUNCH-011 — Clean-Machine Journey (REQUIRED check, decision D7)
#
# On every claimed hosted target, from a fresh runner and a scratch HOME:
#
#   build → package → install → launch → core-agent smoke → update → uninstall
#
#   CLI  (scripts/journey/cli-journey.ts), two channels per target:
#     binary  the real install.sh / install.ps1 against a loopback release
#             server (XR_INSTALL_BASE_URL), then `xr update --check` sees a
#             synthetic N+1 and the installer upgrades to it
#     npm     `npm i -g` of the packed tarball, then `xr update` through a
#             loopback registry scoped to @rrrtx
#   Docker (scripts/journey/docker-journey.ts): build, serve health, agent run
#             inside the container, image + volume removal
#   Desktop: the `journey` job in desktop-app.yml (needs the bundles).
#
# The agent smoke drives a deterministic loopback provider (no API keys, no
# paid calls). Every leg uploads a JSON evidence record; scripts/support-matrix.ts
# turns those into docs/release/SUPPORT_MATRIX.md.
#
# No `paths:` filter: a required check must report on every PR.
# =============================================================================
name: Clean-Machine Journey

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: journey-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cli:
    name: CLI journey — ${{ matrix.channel }} on ${{ matrix.runsOn }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 40
    # Windows ARM64 is reported, not gating (D4/D7): its result is in the
    # evidence and the support matrix, but it cannot block a merge.
    # Linux ARM64 is reported, not gating (owner decision, 2026-10-22): the
    # file authority fails closed there (blocked:filesystem-unsupported) —
    # disclosed in SUPPORT_MATRIX.md and the CHANGELOG.
    continue-on-error: ${{ matrix.runsOn == 'windows-11-arm' || matrix.runsOn == 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        runsOn: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15, macos-15-intel, windows-latest, windows-11-arm]
        channel: [binary, npm]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        if: matrix.runsOn != 'windows-11-arm'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # setup-bun installs the x64 build on Windows ARM (emulated); the journey
      # must prove the native arm64 runtime, so install it checksum-verified.
      - name: Install native bun-windows-aarch64 (windows-11-arm)
        if: matrix.runsOn == 'windows-11-arm'
        run: |
          set -euo pipefail
          ver="$(tr -d ' \r\n' < .bun-version)"
          base="https://github.com/oven-sh/bun/releases/download/bun-v${ver}"
          mkdir -p "$RUNNER_TEMP/bun" && cd "$RUNNER_TEMP/bun"
          curl -fsSL -o bun.zip "$base/bun-windows-aarch64.zip"
          curl -fsSL -o SHASUMS256.txt "$base/SHASUMS256.txt"
          want="$(grep ' bun-windows-aarch64.zip$' SHASUMS256.txt | cut -d' ' -f1)"
          got="$(sha256sum bun.zip | cut -d' ' -f1)"
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::bun-windows-aarch64.zip checksum mismatch"; exit 1; }
          unzip -q bun.zip
          echo "$RUNNER_TEMP/bun/bun-windows-aarch64" >> "$GITHUB_PATH"
      - name: Setup Node (npm channel)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Journey
        run: bun run scripts/journey/cli-journey.ts --channel ${{ matrix.channel }} --evidence "evidence/cli-${{ matrix.channel }}-${{ matrix.runsOn }}.json"
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-evidence-cli-${{ matrix.channel }}-${{ matrix.runsOn }}
          path: evidence/*.json
          if-no-files-found: warn

  docker:
    name: Docker image journey (linux/${{ matrix.arch }})
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 40
    # linux/arm64 is reported, not gating (same Linux ARM64 file-authority
    # limitation as the cli job; disclosed in SUPPORT_MATRIX.md).
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runsOn: ubuntu-24.04 }
          - { arch: arm64, runsOn: ubuntu-24.04-arm }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Journey
        run: bun run scripts/journey/docker-journey.ts --evidence "evidence/docker-${{ matrix.arch }}.json"
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-evidence-docker-${{ matrix.arch }}
          path: evidence/*.json
          if-no-files-found: warn

  # The ONE required check for this workflow (.github/required-checks.json).
  journey-gate:
    name: Clean-Machine Journey gate
    needs: [cli, docker]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Download journey evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: journey-evidence-*
          path: evidence
          merge-multiple: true
      - name: Render the matrix (summary + artifact; the committed doc is refreshed by the owner)
        run: |
          bun run scripts/support-matrix.ts --evidence evidence --out "$RUNNER_TEMP/SUPPORT_MATRIX.md"
          cat "$RUNNER_TEMP/SUPPORT_MATRIX.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload rendered matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-matrix
          path: ${{ runner.temp }}/SUPPORT_MATRIX.md
      - name: Fail unless every gating journey passed
        if: needs.cli.result != 'success' || needs.docker.result != 'success'
        run: |
          echo "::error::cli=${{ needs.cli.result }} docker=${{ needs.docker.result }}"
          exit 1
