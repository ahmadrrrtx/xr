# =============================================================================
# XR Phase 9 · T3 — channel install tests ("supported" means install-validated).
#
# Tier 1 (every PR/push): what can be proven WITHOUT a published release —
#   · channel configs are generated + in sync (channel:check)
#   · .deb REAL install + remove on Linux (dpkg is the channel; the payload is
#     the same canonical binary bytes the release ships)
#   · Homebrew formula syntax/field validation on macOS (Ruby eval, no fetch)
#   · WinGet manifest schema validation on Windows + Scoop manifest parse
#   · stamped manifests' sha256 equals the canonical build's SHA256SUMS
#
# Tier 2 (on published releases — schedule + workflow_dispatch only):
#   · REAL installs from the published release assets via each manager:
#     dpkg -i, brew install (formula), scoop install, winget install
#     (skipped when the release assets for the current version don't exist —
#     reported, never fabricated green).
# =============================================================================
name: Channel Install Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly real-install validation of the published release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Tier 1a: .deb real install (Linux) ───────────────────────────────────
  deb-install:
    name: .deb — build, real dpkg install, smoke, remove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build canonical linux binary + .deb
        run: |
          bun run scripts/build-matrix.ts --targets linux-x64 --out dist
          V=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("release.manifest.json","utf8")).identity.version)')
          bun run scripts/build-deb.ts --bin dist/xr-linux-x64 --out "dist/xr_${V}_amd64.deb"
      - name: Real install via dpkg (the apt channel payload)
        run: |
          DEB=$(ls dist/xr_*_amd64.deb)
          sudo dpkg -i "$DEB"
          test -x /usr/bin/xr
          XR_HOME=/tmp/xr-deb-home /usr/bin/xr --version
          XR_HOME=/tmp/xr-deb-home /usr/bin/xr doctor --json || test $? -eq 1
          dpkg -L xr | grep -q /usr/bin/xr
          dpkg-deb -e "$DEB" /tmp/xr-ctrl
          (cd / && md5sum -c <(sed 's|usr/bin/xr|usr/bin/xr|' /tmp/xr-ctrl/md5sums))
          rm -rf /tmp/xr-deb-home /tmp/xr-ctrl
      - name: "Reversible: remove and assert effects"
        run: |
          sudo dpkg -r xr
          test ! -e /usr/bin/xr

  # ── Tier 1a.2: windows-arm64 zip, built on the PROVEN cross-compile host ──
  # Measured on PR #190 CI (two attempts, identical error): bun 1.3.14 cannot
  # extract the 'bun-windows-aarch64' baseline on windows-x64 RUNNERS
  # ("Failed to extract executable … The download may be incomplete"), while
  # the same compile succeeds on Linux and macOS hosts. The arm64 zip this
  # lane's stamps bind therefore comes from a macOS-hosted fan-in job instead
  # of being compiled inside the windows-latest lane.
  windows-arm64-source:
    name: windows-arm64 canonical build (cross-compile fan-in)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build windows-arm64 + zip
        shell: bash
        run: |
          bun run scripts/build-matrix.ts --targets "windows-arm64" --out dist --skip-smoke
          mkdir -p dist/zip && cp dist/xr-windows-arm64.exe dist/zip/xr.exe
          (cd dist/zip && zip -q ../xr-windows-arm64.zip xr.exe)
          test -f dist/xr-windows-arm64.zip
          rm -rf dist/zip
      - name: Upload arm64 canonical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xr-windows-arm64-zip
          if-no-files-found: error
          path: |
            dist/xr-windows-arm64.exe
            dist/xr-windows-arm64.zip

  # ── Tier 1b: Homebrew + WinGet + Scoop structural validation ─────────────
  channel-structural:
    name: ${{ matrix.name }} — stamped channels match canonical build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: windows-arm64-source
    strategy:
      fail-fast: false
      matrix:
        include:
          # L-004: the canonical set this lane validates must mirror
          # release.yml's windows leg (x64 + arm64) or the fail-closed
          # two-arch stamping in channel-manifest.ts correctly refuses.
          # The Windows lane builds x64 locally and fetches the arm64 zip from
          # windows-arm64-source — see that job's note (windows-x64 RUNNERS
          # cannot extract the bun-windows-aarch64 baseline: verified broken,
          # not flaky).
          - { name: macOS-homebrew, os: macos-latest, targets: "linux-x64,linux-arm64,darwin-arm64,darwin-x64,windows-x64,windows-arm64", channels: "" }
          - { name: Windows-winget-scoop, os: windows-latest, targets: "windows-x64", channels: "winget,scoop" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build the canonical binary set this lane validates
        shell: bash
        run: |
          bun run scripts/build-matrix.ts --targets "${{ matrix.targets }}" --out dist --skip-smoke
      - name: Channel zip (macOS lane)
        if: matrix.name == 'macOS-homebrew'
        shell: bash
        run: |
          mkdir -p dist/zip && cp dist/xr-windows-x64.exe dist/zip/xr.exe
          (cd dist/zip && zip -q ../xr-windows-x64.zip xr.exe)
          test -f dist/xr-windows-x64.zip
          cp dist/xr-windows-arm64.exe dist/zip/xr.exe
          (cd dist/zip && zip -q ../xr-windows-arm64.zip xr.exe)
          test -f dist/xr-windows-arm64.zip
          rm -rf dist/zip
      - name: Channel zip (Windows lane)
        if: matrix.name == 'Windows-winget-scoop'
        shell: pwsh
        run: |
          # Compress-Archive is a PowerShell builtin — no zip/7z availability gamble.
          New-Item -ItemType Directory -Force dist/zip | Out-Null
          Copy-Item dist/xr-windows-x64.exe dist/zip/xr.exe
          Compress-Archive -Path dist/zip/xr.exe -DestinationPath dist/xr-windows-x64.zip -Force
          if (-not (Test-Path dist/xr-windows-x64.zip)) { throw "x64 zip not produced" }
          Remove-Item -Recurse -Force dist/zip
      # arm64 zip comes from the macOS fan-in job (windows-x64 runners cannot
      # extract the bun-windows-aarch64 baseline — verified twice on this PR).
      - name: Fetch the windows-arm64 canonical artifacts
        if: matrix.name == 'Windows-winget-scoop'
        uses: actions/download-artifact@v4
        with:
          name: xr-windows-arm64-zip
          path: dist
      - name: Assert both windows zips exist (x64 built here, arm64 fanned in)
        if: matrix.name == 'Windows-winget-scoop'
        shell: pwsh
        run: |
          if (-not (Test-Path dist/xr-windows-arm64.zip)) { throw "arm64 zip missing after fan-in" }
          if (-not (Test-Path dist/xr-windows-arm64.exe)) { throw "arm64 binary missing after fan-in" }
      - name: Stamp channels from this build's checksums
        shell: bash
        run: |
          cd dist
          sha256sum $(ls | grep -v '^SHA256SUMS$' | grep -v '^zip$') > SHA256SUMS
          cat SHA256SUMS
          cd ..
          if [ -n "${{ matrix.channels }}" ]; then
            bun run scripts/channel-manifest.ts --stamp --sums dist/SHA256SUMS --out dist/channels --channels "${{ matrix.channels }}"
          else
            bun run scripts/channel-manifest.ts --stamp --sums dist/SHA256SUMS --out dist/channels
          fi
      - name: Homebrew formula syntax + fields validate (no network fetch)
        if: matrix.name == 'macOS-homebrew'
        run: |
          brew ruby -e '
            require_relative "dist/channels/homebrew/xr.rb"
            raise "formula must bind the canonical sha256" if Xr.stable.url.include?("PLACEHOLDER")
            puts "formula OK: #{Xr.version}"
          '
      - name: WinGet manifests validate against the schema + hash matches build
        if: matrix.name == 'Windows-winget-scoop'
        shell: pwsh
        run: |
          $sha = (Get-FileHash dist/xr-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          $installer = Get-Content dist/channels/winget/manifests/a/ahmadrrrtx/XR/*/ahmadrrrtx.XR.installer.yaml -Raw
          if ($installer -notmatch [regex]::Escape("InstallerSha256: $sha")) { throw "winget installer sha256 does not match canonical build" }
          $scoop = Get-Content dist/channels/scoop/xr.json -Raw | ConvertFrom-Json
          if ($scoop.architecture.'64bit'.hash -ne $sha) { throw "scoop manifest hash does not match canonical build" }
          Write-Host "winget + scoop manifests bind the canonical build ($sha)"
          # Two-arch contract (L-004): the arm64 entry must bind the arm64 zip's
          # real hash, not share x64's — arch-swapped shas are the exact hazard
          # this job exists to refuse.
          $shaArm = (Get-FileHash dist/xr-windows-arm64.zip -Algorithm SHA256).Hash.ToLower()
          if (-not ($installer -match "(?s)Architecture: arm64.*?InstallerSha256: $shaArm")) { throw "winget arm64 installer sha256 does not match canonical build" }
          if ($scoop.architecture.arm64.hash -ne $shaArm) { throw "scoop arm64 hash does not match canonical build" }
          Write-Host "winget + scoop arm64 entries bind the arm64 build ($shaArm)"

  # ── Tier 2: REAL installs from the published release (weekly/on-demand) ──
  published-release-installs:
    name: Real channel installs of the public version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, channel: apt }
          - { os: macos-latest, channel: brew }
          - { os: windows-latest, channel: scoop }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Resolve the public version's release assets
        # The PUBLIC version (release.manifest.json channels.publicVersion), not
        # GitHub's "latest": v1.1.0 was "latest" with no CLI assets, so this job
        # warned and exited 0 every week while every channel was broken
        # (launch audit XR-LAUNCH-001/012). Missing assets are now a failure.
        shell: bash
        id: rel
        run: |
          V=$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("release.manifest.json","utf8")).channels.publicVersion)')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${{ github.repository }}/releases/download/v${V}/SHA256SUMS")
          if [ "$code" != "200" ]; then
            echo "::error::public version v${V} has no SHA256SUMS on its GitHub release (HTTP $code) — every channel claim for it is false"
            exit 1
          fi
      - name: apt channel — real install from published .deb
        if: matrix.channel == 'apt'
        run: |
          V="${{ steps.rel.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v${V}"
          curl -fsSL "$BASE/SHA256SUMS" -o /tmp/SHA256SUMS
          curl -fsSL "$BASE/xr_${V}_amd64.deb" -o /tmp/xr.deb
          expected=$(awk '/_.*.deb$/ {print $1}' /tmp/SHA256SUMS)
          echo "$expected  /tmp/xr.deb" | sha256sum -c -
          sudo dpkg -i /tmp/xr.deb
          test "$(/usr/bin/xr --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" = "$V"
          sudo dpkg -r xr
      - name: brew channel — real install from the tap
        if: matrix.channel == 'brew'
        env:
          TAP_NAME: ahmadrrrtx/tap
        run: |
          V="${{ steps.rel.outputs.version }}"
          brew install "$TAP_NAME/xr"
          xr --version | grep "$V"
          brew uninstall xr
      - name: scoop channel — real install via the published manifest
        if: matrix.channel == 'scoop'
        shell: pwsh
        run: |
          $V = '${{ steps.rel.outputs.version }}'
          # GitHub release assets are flat: the stamped scoop manifest is the asset "xr.json".
          Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/v$V/xr.json" -OutFile xr.json
          scoop install ./xr.json
          xr --version | Select-String $V
          scoop uninstall xr
