# =============================================================================
# XR R-6 (known-limitations register #11) — Provider canaries
#
# NON-GATING (decision D7). Every night:
#   · keyless leg (must pass): the canary harness probes the deterministic
#     loopback fixture provider (scripts/canary-fixture.ts) — proves the
#     harness without secrets or charges;
#   · live leg: each preset with a repository secret is probed live (its own
#     health() call — the same one `xr doctor` uses) and a probe failure fails
#     the job; presets without a secret are SKIP, never a fake pass. With no
#     secrets at all the live leg is an explicit audited skip
#     (XR_CANARY_ALLOW_EMPTY=1 on that step only) instead of a red run.
#
# Activation: add any of the secrets listed in `env:` below (Settings →
# Secrets and variables → Actions). Paid providers are never probed unless the
# owner provisions their key.
# =============================================================================
name: Provider Canaries (non-gating)

on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC daily (offset from the golden-path nightly)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-canaries:
    name: Live provider smoke ({pass|fail|skip} per preset)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # One entry per hosted preset.apiKeyEnv (16 hosted presets; bedrock's
      # AWS chain is ambient and intentionally not mapped). Absent secret =
      # blank = SKIP row. XR_HOME is hermetic: nothing leaks between runs.
      XR_HOME: /tmp/xr-canary-home
      HOME: /tmp/xr-canary-home
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      # XR-LAUNCH-012: the harness is proven keylessly on every run, against
      # the deterministic loopback fixture — this leg must be green.
      - name: Canary harness vs the loopback fixture (keyless, must pass)
        run: bun run scripts/canary-fixture.ts --json "$RUNNER_TEMP/provider-canaries-fixture.json"

      # Live presets: only those whose secret is provisioned. With none, this is
      # an explicit, audited skip (not a red run) — live canaries are
      # non-gating and never incur charges without an owner-provided key.
      - name: Live provider canaries (secrets-gated; audited skip when none)
        env:
          XR_CANARY_ALLOW_EMPTY: "1"
        run: bun run canary:providers --json "$RUNNER_TEMP/provider-canaries.json"
        # A configured provider failing its live probe = a red nightly.
        # Zero configured providers = exit 2 unless XR_CANARY_ALLOW_EMPTY=1.

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-canaries
          path: ${{ runner.temp }}/provider-canaries*.json
          retention-days: 30
          if-no-files-found: ignore
