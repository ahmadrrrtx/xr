# =============================================================================
# XR R-6 (known-limitations register #11) — Provider canaries
#
# Every night, smoke every provider that is ACTUALLY configured in CI:
#   · a preset with a repository secret key is probed live (its own health()
#     call — the same one `xr doctor` uses) and a probe failure FAILS the job;
#   · a preset without a secret is reported SKIP — never a fake pass, and a
#     skip never fails the run. Coverage therefore scales exactly with the
#     secrets the maintainer provisions; nothing is claimed beyond evidence.
#
# Activation: add any of the secrets listed in `env:` below (Settings →
# Secrets and variables → Actions). Zero secrets = all-SKIP green report;
# one bad key = red job with the provider and the HTTP detail.
# =============================================================================
name: Provider Canaries

on:
  schedule:
    - cron: "41 3 * * *" # 03:41 UTC daily (offset from the golden-path nightly)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-canaries:
    name: Live provider smoke ({pass|fail|skip} per preset)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One entry per hosted preset.apiKeyEnv (16 hosted presets; bedrock's
      # AWS chain is ambient and intentionally not mapped). Absent secret =
      # blank = SKIP row. XR_HOME is hermetic: nothing leaks between runs.
      XR_HOME: /tmp/xr-canary-home
      HOME: /tmp/xr-canary-home
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run provider canaries
        run: bun run canary:providers --json "$RUNNER_TEMP/provider-canaries.json"
        # A configured provider failing its live probe = a red nightly. Skips
        # (unconfigured presets) are green by design — see script header.

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-canaries
          path: ${{ runner.temp }}/provider-canaries.json
          retention-days: 30
          if-no-files-found: ignore
