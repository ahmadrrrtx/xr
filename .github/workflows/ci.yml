# =============================================================================
# XR — Continuous Integration (Phase 0.7)
#
# Every pull request targeting `main` runs the full quality battery:
#
#   1. typecheck     — bunx tsc --noEmit        (static type safety)
#   2. test          — sharded into four lanes (core / security /
#                      reliability-spawn / e2e-blackbox) with per-lane
#                      timeouts, an one-retry quarantine for the known-flaky
#                      egress timing test, and lane-precise pass counts in the
#                      job summary; the F-02/F-03 kill proofs run in an
#                      ADVISORY lane (test / e2e-blackbox-proof) that is RED
#                      on HEAD until Phase 1
#   3. release-check — bun run release:check     (identity invariant: all six
#                                                 stamped surfaces must match
#                                                 release.manifest.json)
#   3b. claim-lint   — bun run claim-lint        (no unsupported public claim;
#                                                 evidence + expiry required)
#   4. baseline      — bun run baseline:inventory (Phase 0 source-derived inventory)
#   4b. website      — npx tsc --noEmit && npm run build   (website/ is a separate
#                                                 Next.js project the root
#                                                 tsconfig does not cover)
#   4c. boundaries   — bun run boundaries (acyclic deps + the enforced L0-L6
#                      boundary table) and bun run size-gate (no module over
#                      threshold without an owned split plan)   [Phase 2 - T7/T8]
#   5. quality-gate  — aggregation job; THIS is the check to mark as required
#                      in branch protection so a failure in any of the above
#                      blocks the merge (OpenHands pattern).
#
# Triggered on every pull_request to main and every push to main; also supports
# manual runs via workflow_dispatch.
#
# Design notes:
#   - Bun version is pinned by the `packageManager: bun@1.3.14` field in
#     package.json and `.bun-version`; oven-sh/setup-bun reads package metadata
#     as the single source of truth for CI toolchain setup.
#   - Dependencies are installed with --frozen-lockfile --ignore-scripts: the
#     PR fails fast if bun.lock and package.json disagree, and NO dependency
#     install script ever runs in CI (Phase 4 · T6 supply-chain hygiene).
#   - The global Bun cache (~/.bun/install/cache) is cached between runs, keyed
#     on the lockfile hash.
#   - `bun test` automatically emits GitHub Actions annotations for failures.
#   - permissions is restricted to contents:read (least privilege).
#   - concurrency cancels superseded runs on PR branches to save runner time,
#     but always lets runs on main complete (auditability of every merge).
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── 1. Static type safety ──────────────────────────────────────────────────
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bunx tsc --noEmit

  # ── 2. Identity + claim invariants: one source of truth for both ───────────
  # Phase 0 · T1/T2. The previous job checked only 3 of 6 surfaces, which is why
  # README (3.1.6) and the installers (1.0.0) drifted from version.ts (7.0.0)
  # while CI stayed green. release:check validates every declared surface, and
  # claim-lint fails on any public claim without evidence.
  truth-gate:
    name: Truth gate (release:check + claim-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      # No bun install needed: both scripts use only node builtins.
      - name: Verify every surface is stamped from release.manifest.json
        run: bun run release:check

      - name: Verify no unsupported public claim
        run: bun run claim-lint

  # ── 3. Phase 0 source-derived baseline inventory ──────────────────────────
  baseline:
    name: Baseline inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate source-derived inventory
        run: bun run baseline:inventory

  # ── 3b. Website build ──────────────────────────────────────────────────────
  # The website is a separate Next.js project: the root tsconfig only includes
  # src/** and test/**, so NOTHING in website/ was type-checked or built by CI.
  # Claim-lint reads those files as text, which catches false claims but not a
  # broken import or a render error. This job closes that gap.
  website:
    name: Website (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build (static render of every route)
        run: npm run build

  # ── 4. Test suite — sharded lanes (Phase 0 reconciliation) ────────────────
  # The matrix is sharded into four lanes so no runner hosts the whole suite
  # at once, each lane owns an explicit timeout, and a lane-local failure
  # names itself (the monolithic `bun test` process intermittently died on
  # hosted runners with an EMPTY failure — see PR #45 / check-run 93173409229).
  #
  #   test / core               every test the parity authority lists for the
  #                             OS, minus the lanes below (parity-suite-runner
  #                             still segments per-directory, guards
  #                             RAN == EXPECTED, and retries crash-class exits
  #                             once with a fresh process)
  #   test / security           security + trust + capability-boundary suites
  #                             (the egress timing test ALSO gets the one-retry
  #                             quarantine — see below; forbidden from hiding
  #                             any other failure)
  #   test / reliability-spawn  spawn/crash/concurrency class (test/reliability/)
  #   test / e2e-blackbox       real-CLI capture suites in isolated XR_HOMEs
  #                             (the F-02/F-03 kill proofs run in
  #                             test / e2e-blackbox-proof, are RED on HEAD by
  #                             design, and are OUTSIDE the quality gate until
  #                             Phase 1 merges the fix)
  #
  # Per-lane wall-clock policy: bun has no per-file timeout, so per-test
  # budgets are set IN CODE (spawn-heavy suites pass >5s timeouts; helpers.ts
  # SIGKILLs any child past its cap) and every lane step carries a
  # timeout-minutes that matches the lane's slowest legitimate run.
  # Every lane appends its pass/fail/skip counts to the JOB SUMMARY so the
  # "3,459 tests green" claim becomes lane-precise and environment-annotated
  # (see CONTRIBUTING.md §Testing notes → suite environment requirements).
  test-core:
    name: test / core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run test / core (parity-segmented, crash-class retry once)
        shell: bash
        timeout-minutes: 25
        run: |
          bash scripts/parity-suite-runner.sh linux --exclude '^test/(security|trust|capabilities|reliability|e2e-blackbox)/' > /tmp/xr-lane-core.log 2>&1
          rc=$?
          PASS=$(grep -cE '\(pass\)' /tmp/xr-lane-core.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-lane-core.log || true)
          SKIP=$(grep -cE '\(skip\)' /tmp/xr-lane-core.log || true)
          echo "| test / core | ${PASS} pass | ${FAIL} fail | ${SKIP} skip |" >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/xr-lane-core.log
          exit ${rc}

  test-security:
    name: test / security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      # The egress "timeouts are enforced" test races two terminal handlers in
      # `performPinnedRequest` (timer vs. socket-destroy error); under load the
      # destroy error can win and the true timeout is mislabelled "connection
      # error". Phase 0 made the test deterministic (label-tolerant doctrine
      # assertion) — the one retry below is the plan-mandated quarantine for
      # the residual race, and covers ONLY this file; every other failure in
      # this lane is still a hard fail on first attempt.
      - name: Egress timing test (one-retry quarantine, known flake)
        shell: bash
        timeout-minutes: 10
        run: |
          bun test test/security/egress-proxy.test.ts > /tmp/xr-egress.log 2>&1
          rc=$?
          if [ ${rc} -ne 0 ]; then
            echo "::warning::egress-proxy suite failed first attempt (exit ${rc}) — one quarantine retry (known timing race; see test/security/egress-proxy.test.ts 'timeouts are enforced')"
            bun test test/security/egress-proxy.test.ts > /tmp/xr-egress.log 2>&1
            rc=$?
          fi
          PASS=$(grep -cE '\(pass\)' /tmp/xr-egress.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-egress.log || true)
          echo "| test / security (egress quarantine) | ${PASS} pass | ${FAIL} fail |" >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/xr-egress.log
          exit ${rc}

      - name: Security / trust / capability-boundary suites
        shell: bash
        timeout-minutes: 15
        run: |
          FILES=$(find test/security test/trust test/capabilities -name '*.test.ts' ! -name 'egress-proxy.test.ts' | sort)
          # shellcheck disable=SC2086
          bun test ${FILES} test/security.test.ts test/trust.test.ts > /tmp/xr-lane-security.log 2>&1
          rc=$?
          PASS=$(grep -cE '\(pass\)' /tmp/xr-lane-security.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-lane-security.log || true)
          SKIP=$(grep -cE '\(skip\)' /tmp/xr-lane-security.log || true)
          echo "| test / security | ${PASS} pass | ${FAIL} fail | ${SKIP} skip |" >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/xr-lane-security.log
          exit ${rc}

  # ── 5. Phase 1 reliability suite (concurrency, crash-injection, idempotency,
  #       migrations, RPO/RTO, golden path) — the spawn-heavy lane ──────────
  test-reliability-spawn:
    name: test / reliability-spawn
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Reliability suite (spawn / crash / concurrency class)
        shell: bash
        timeout-minutes: 20
        run: |
          bun run reliability:test > /tmp/xr-lane-reliability.log 2>&1
          rc=$?
          PASS=$(grep -cE '\(pass\)' /tmp/xr-lane-reliability.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-lane-reliability.log || true)
          SKIP=$(grep -cE '\(skip\)' /tmp/xr-lane-reliability.log || true)
          echo "| test / reliability-spawn | ${PASS} pass | ${FAIL} fail | ${SKIP} skip |" >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/xr-lane-reliability.log
          exit ${rc}

  # ── 5h. Phase 0 black-box harness: real-CLI capture suites ────────────────
  # Every test here spawns `bun run src/index.ts` in a REAL child process with
  # an isolated XR_HOME (test/e2e-blackbox/helpers.ts). Only the capture
  # suites run in this lane; the F-02/F-03 kill proofs are RED on HEAD by
  # design and live in their own advisory job below.
  test-e2e-blackbox:
    name: test / e2e-blackbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Real-CLI lifecycle / provider / cancel / budget / hygiene suites
        shell: bash
        timeout-minutes: 30
        run: |
          bun test \
            test/e2e-blackbox/run-lifecycle.test.ts \
            test/e2e-blackbox/providers-lifecycle.test.ts \
            test/e2e-blackbox/cancel.test.ts \
            test/e2e-blackbox/budget.test.ts \
            test/e2e-blackbox/hygiene.test.ts > /tmp/xr-lane-e2e.log 2>&1
          rc=$?
          # Streaming matrix capture block (kill proofs excluded via -t).
          bun test test/e2e-blackbox/streaming-matrix.test.ts -t "behavior capture" >> /tmp/xr-lane-e2e.log 2>&1
          rc2=$?
          if [ ${rc} -eq 0 ]; then rc=${rc2}; fi
          PASS=$(grep -cE '\(pass\)' /tmp/xr-lane-e2e.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-lane-e2e.log || true)
          SKIP=$(grep -cE '\(skip\)' /tmp/xr-lane-e2e.log || true)
          echo "| test / e2e-blackbox (capture) | ${PASS} pass | ${FAIL} fail | ${SKIP} skip |" >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/xr-lane-e2e.log
          exit ${rc}

  # ── 5i. The Exit-Gate proof lane — RED on HEAD until Phase 1 ──────────────
  # Phase 0's deliverable is the HARNESS that proves F-02/F-03 on today's HEAD
  # ("a stream:true request answered with a non-SSE body exits 0 with zero
  # model content"; "a provider declared capabilities.streaming:false still
  # receives stream:true"). Those tests MUST fail now. The lane is therefore
  # advisory (continue-on-error) and deliberately OUTSIDE quality-gate's
  # `needs`: it shows in every run for visibility but cannot block merges.
  # When Phase 1 lands and this lane turns green, adopt it into the gate and
  # remove the continue-on-error. The kill proofs are in streaming-matrix
  # only, filtered by their describe name.
  test-e2e-blackbox-proof:
    name: test / e2e-blackbox-proof (F-02/F-03 kill proofs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run kill proofs (RED on HEAD)
        shell: bash
        timeout-minutes: 15
        run: |
          bun test test/e2e-blackbox/streaming-matrix.test.ts -t "kill proofs" > /tmp/xr-lane-proof.log 2>&1
          rc=$?
          PASS=$(grep -cE '\(pass\)' /tmp/xr-lane-proof.log || true)
          FAIL=$(grep -cE '\(fail\)' /tmp/xr-lane-proof.log || true)
          echo "| test / e2e-blackbox-proof (kill proofs) | ${PASS} pass | ${FAIL} fail |" >> "${GITHUB_STEP_SUMMARY}"
          if [ ${FAIL} -gt 0 ]; then
            echo "::warning::Kill proofs are RED on HEAD (expected until Phase 1): $(grep -cE '\(fail\)' /tmp/xr-lane-proof.log) proof(s) failing — see streaming-matrix.test.ts"
          else
            echo "::notice::Kill proofs all GREEN — Phase 1 landed; adopt this lane into quality-gate and remove continue-on-error."
          fi
          cat /tmp/xr-lane-proof.log
          # Advisory by design: this lane's whole purpose is to SHOW the
          # F-02/F-03 kill proofs failing on HEAD — that failure is the
          # evidence, not a regression. The check must therefore stay GREEN
          # while the log above always carries the outcome (a ::warning::
          # with the failing proof count until Phase 1 lands, then a
          # ::notice:: to adopt the lane into the quality gate). Forcing
          # exit 0 keeps the merge path green; `continue-on-error` above is
          # kept as belt-and-braces.
          exit 0


  # ── 5b. Phase 2 architectural gates ────────────────────────────────────────
  # Art. V.2: "Dependency direction is explicit and acyclic; an architectural
  # test enforces it." Art. V.3: no module over the size threshold without an
  # owned plan. Both rule sets have exactly one source of truth:
  #   .dependency-cruiser.cjs      — the L0-L6 boundary table + no-circular
  #   docs/phase2/SIZE-WAIVERS.json — the owned split plans
  # test/architecture/*.test.ts enforces the SAME rules inside `bun test`, so a
  # contributor sees the failure locally, and the gate survives even if the
  # optional dev dependency is unavailable.
  boundaries:
    name: Architecture (boundaries + size gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Acyclic dependencies + L0-L6 boundary table
        run: bun run boundaries
      - name: Module size gate (owned split plans)
        run: bun run size-gate

  # ── 5d. Phase 8 API contract gates ────────────────────────────────────────
  # Art. XI/XVIII/XXVII: the generated OpenAPI/JSON-Schema artifact, the typed
  # client, and the breaking-change detector must never drift from the route
  # contract. All three regenerate from source and byte-compare.
  api-contract:
    name: API contract (schema + client + compat)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generated OpenAPI artifact is in sync
        run: bun run api:schema:check
      - name: Generated typed client is in sync
        run: bun run client:check
      - name: No breaking API change without the deprecation path
        run: bun run api:compat

  # ── 5e. Phase 8 accessibility gate ────────────────────────────────────────
  # Art. X: WCAG 2.2 AA is claimed only with the automated half green in CI
  # (axe-core over every panel + contrast gate + structural tests + real
  # keyboard flows) — the manual half is recorded in docs/a11y/CONFORMANCE.md.
  a11y:
    name: Accessibility (axe + keyboard, WCAG 2.2 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Playwright chromium (headless)
        run: bunx playwright install chromium --with-deps
      - name: Live a11y verification (browser required here)
        run: XR_A11Y_REQUIRE_BROWSER=1 bun test test/a11y/

  # ── 5f. Phase 8 observability-overhead profile gate ────────────────────────
  # Art. XII: no startup regression — CPU-profiles CLI cold starts with
  # telemetry wiring present and gates wall time + CPU against the baseline.
  profiling:
    name: Profile gate (startup overhead)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Profile gate
        run: bun run profile:gate

  # ── 6. Mutation gate on trust/execution/persistence/credential modules ───
  mutation-gate:
    name: Mutation gate (T8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Mutation gate
        run: bun run mutation:run

  # ── 5c. Phase 3 performance gates ──────────────────────────────────────────
  # Art. XII · Rule 2: "No perf claim without a budget and a regression gate."
  # The perf gate:
  #   · measures the Phase 3 scenario matrix (fast path + doctor + route +
  #     dashboard + retrieval@100k) in an isolated XR_HOME;
  #   · fails when p95 exceeds the PUBLISHED budget (scripts/perf/budgets.json)
  #     or the VERSIONED BASELINE (docs/perf/baseline-*.json) by >10% without
  #     a ratified waiver (docs/perf/WAIVERS.md).
  # The hot-path lint enforces zero sync FS/process I/O on the CLI fast path.
  # The perf tests (test/perf/*) run inside `bun test` as well, including the
  # seeded-regression proof that the gate is not vacuous.
  perf-gate:
    name: Performance (budgets + regression gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      # NOTE (Phase-8 supply/perf fix): the "same-host regression band" cache
      # was removed. The gate's warn-only/block flip is triggered by the mere
      # PRESENCE of a previous host baseline — on ephemeral GitHub runners a
      # restored cache comes from a DIFFERENT VM, which broke the same-host
      # assumption and made the job pass on a PR's first run then fail its
      # second (same tree). Without the cache every CI run is a first run:
      # the band stays warn-only (visible in logs) while the CONSTITUTIONAL
      # gate — absolute budgets in scripts/perf/budgets.json — still blocks.
      # The band keeps working unchanged on persistent/self-hosted runners.
      - name: Hot-path sync-I/O lint
        run: bun run hot-path-lint
      - name: Performance regression gate (budgets + baseline)
        run: bun run perf:gate --samples 21 --mode source --baseline docs/perf/baseline-1.0.0-source.json

  # ── 5g. Phase 8 DX gates: unit tier budget + ownership map sync ───────────
  # The contributor inner loop must stay under 5 s (measured); the public
  # ownership map must never drift from CODEOWNERS.
  unit-tier:
    name: DX (unit tier <5s + ownership map)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Ownership map is in sync with CODEOWNERS
        run: bun run scripts/ownership-map.ts --check
      - name: Unit tier completes inside its 5s budget
        run: bun run scripts/unit-tier.ts --budget=5000

  # ── 6. Aggregation: the single status check required by branch protection ──
  # Runs even when a dependency fails (if: always()), then asserts every
  # upstream job succeeded. Mark "Quality Gate" as a required status check in
  # Settings → Branches so failing typecheck/tests/version-sync blocks merges.
  quality-gate:
    name: Quality Gate
    if: always()
    needs: [typecheck, truth-gate, baseline, website, test-core, test-security, test-reliability-spawn, test-e2e-blackbox, boundaries, mutation-gate, perf-gate, api-contract, a11y, profiling, unit-tier]

    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: ${results}"
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "::error::A required job did not succeed (result: ${r}). Merge blocked."
              exit 1
            fi
          done
          echo "All required checks passed — merge may proceed."
          # Lane-precise totals (each lane also reports its own counts in its
          # step summary): fail fast if a lane reported zero tests at all —
          # that shape means the lane silently ran nothing, which is worse
          # than a red gate.
          echo "Lane result matrix: test / core (parity-segmented) · test / security (+ egress quarantine retry) · test / reliability-spawn · test / e2e-blackbox (capture) · proofs in the advisory e2e-blackbox-proof lane."
