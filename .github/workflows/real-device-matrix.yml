# Phase 5 · real-device matrix — the GA gate the master plan demands.
#
# GitHub-hosted runners ARE the real devices here (Windows Server, macOS,
# Ubuntu). Each lane downloads the bundles the `bundle` job of the Desktop App
# workflow produced for that OS, then scripts/real-device-matrix.ts performs:
#   installed  — silent install + app boot + sidecar liveness on :3141
#   upgraded   — base install → current install on top → XR_HOME state intact
# When a previous-release bundle set is attached to the release, pass it via
# repo variable RDM_PREV_URL to make the upgraded lane a REAL version bump;
# without it the lane runs mechanics-only and says so in its output.
#
# This workflow can never go green by accident: every assertion in the probe
# script is a measured fact (exit codes, TCP/HTTP answers, directory contents).

name: Real-Device Matrix (non-gating)

on:
  workflow_run:
    workflows: ["Desktop App (Tauri packaging)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Desktop App run id whose artifacts to install"
        required: true
        type: string

permissions:
  contents: read
  actions: read # download artifacts from the triggering run

concurrency:
  group: rdm-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `slug` is the artifact suffix desktop-app.yml's bundle job uploads
          # (xr-desktop-<slug>). The old xr-desktop-<runner> name never existed,
          # which is why every run failed with "artifact not found" (XR-LAUNCH-012).
          - { runner: ubuntu-22.04, os: linux, slug: linux-x64 }
          - { runner: macos-latest, os: macos, slug: darwin-arm64 }
          - { runner: windows-latest, os: windows, slug: windows-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve source run
        id: src
        shell: bash
        run: |
          RUN="${{ github.event.workflow_run.id || github.event.inputs.run_id }}"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install engine deps (probe script runtime)
        run: bun install --frozen-lockfile --ignore-scripts

      # The Tauri .deb declares runtime deps (WebKit, appindicator, …) that
      # `dpkg -i` will not pull in on its own: it unpacks, then refuses to
      # configure, and the lane dies before the app ever boots. Install them
      # up front — xvfb alone is not enough for a WebView shell.
      - name: Linux runtime deps for the installed lane
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb \
            libwebkit2gtk-4.1-0 \
            libjavascriptcoregtk-4.1-0 \
            libsoup-3.0-0 \
            libayatana-appindicator3-1 \
            librsvg2-2

      - name: Download this OS's bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: xr-desktop-${{ matrix.slug }}
          path: rdm-bundles
          run-id: ${{ steps.src.outputs.run }}
          # v4 needs these three together to read out of a *different* run;
          # without an explicit token it only looks inside the current run and
          # reports the artifact as missing even though it is there.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Optional previous-release bundles (real upgrade when present)
        if: vars.RDM_PREV_URL != ''
        shell: bash
        run: |
          mkdir -p rdm-prev && cd rdm-prev
          curl -sL "${{ vars.RDM_PREV_URL }}/xr-desktop-${{ matrix.slug }}.zip" -o prev.zip
          unzip -q prev.zip && rm prev.zip

      - name: Run the real-device probe (installed + upgraded)
        shell: bash
        run: |
          if [ -d rdm-prev ] && [ -n "$(ls -A rdm-prev 2>/dev/null)" ]; then
            bun run scripts/real-device-matrix.ts --bundles rdm-bundles --prev rdm-prev
          else
            bun run scripts/real-device-matrix.ts --bundles rdm-bundles
          fi
