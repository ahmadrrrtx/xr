# =============================================================================
# XR Phase 10 · Step 3 — nightly soak (NON-GATING, decision D7)
#
# XR-LAUNCH-012: the job used to request a 24h run with a 25h timeout, but a
# GitHub-hosted job is capped at 6h, so EVERY run was cancelled and produced no
# report. The nightly window is now 5h (300 min, under a 330-min job timeout),
# and dispatch input is clamped to that ceiling; longer endurance evidence is
# the accumulation of nightly reports (trend), as below.
#
# Every audit noted the absence of soak/load evidence. This runs the real CLI as
# a pool of concurrent task runs against the deterministic in-tree stub provider
# (no network, no keys) for 24h, sampling memory/CPU/DB-size and publishing a
# per-operation-cost baseline. Leak detection = TREND across nights, not a single
# threshold: the nightly report's bytes-per-task and peak worker RSS are compared
# against the prior nights' baselines.
#
# Acceptance criterion 3 requires 2 consecutive WEEKS clean. Because a single
# workflow run cannot span the window, the maintainer runs this nightly for the
# certification window and the readiness gate consumes the accumulated artifacts
# (per-night JSON + the git-committed baseline snapshot).
#
# Local / dispatch validation: use workflow_dispatch with inputs.minutes to run a
# short bounded soak (e.g. 2 minutes) to prove the harness on a runner.
# =============================================================================
name: Soak (non-gating)

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily (5h soak)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Bounded soak duration in minutes (max 300: hosted jobs stop at 6h)"
        required: false
        default: "300"
      concurrency:
        description: "Concurrent task processes"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  soak:
    name: 5h soak (concurrent tasks vs stub provider)
    runs-on: ubuntu-24.04
    timeout-minutes: 330 # under the 360-min hosted-runner cap, so the report is always written
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run soak
        env:
          # dispatch smoke overrides the default full 24h window
          SOAK_MIN: ${{ github.event.inputs.minutes || '300' }}
          SOAK_CONCURRENCY: ${{ github.event.inputs.concurrency || '4' }}
        run: |
          DATE=$(date -u +%Y%m%dT%H%M%SZ)
          if [ "$SOAK_MIN" -gt 300 ]; then echo "::warning::minutes=$SOAK_MIN exceeds the 300-min hosted ceiling — clamped"; SOAK_MIN=300; fi
          bun run soak \
            --minutes "$SOAK_MIN" \
            --concurrency "$SOAK_CONCURRENCY" \
            --interval 600 \
            --json "soak-$DATE.json" \
            --markdown "soak-$DATE.md"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: soak-report
          path: soak-*.json
          retention-days: 90
          if-no-files-found: ignore
