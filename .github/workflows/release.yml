# =============================================================================
# XR Phase 9 · T1/T2 — signed, reproducible, per-target releases, automated
# from a `v*` tag. One canonical build → many channels (Constitution Art. XXII).
#
# Pipeline: tag → verified PRIVATE draft; explicit owner workflow_dispatch publish=true → promotion after all gates.
# Stable/public defaults never move on a preview or unverified tag.
# Pipeline (canonical builds → authenticated artifacts):
#   gates (release:check + claim-lint + channel:check + typecheck + test subsets)
#     → build.matrix    per-OS canonical binaries + native smoke + windows zip
#     → assemble        npm tarball + source archive + .deb + SHA256SUMS over
#                       EVERYTHING + CycloneDX SBOM + conventional-commit changelog
#     → sign            cosign KEYLESS sign-blob of SHA256SUMS (+ tarball + SBOM),
#                       entries in the public Rekor log (GitHub OIDC → Fulcio)
#     → release         GitHub Release with every asset (prerelease=true when
#                       the tag carries a semver suffix, e.g. v7.2.0-beta.1)
#     → provenance      SLSA3 via slsa-github-generator over assemble's real
#                       output digests (outputs.digests — wired, not assumed)
#     → npm             OIDC trusted publishing, dist-tag latest|beta
#     → docker          GHCR multi-arch image + buildx SLSA/SBOM attestations
#                       + cosign image signature
#     → channels        channel manifests stamped FROM THE SIGNED SHA256SUMS
#                       (channel:check drift gate blocks any out-of-sync config)
#
# Verification: docs/release/VERIFYING_RELEASES.md. Trust-root: cosign bundle
# + public Rekor; identity …/workflows/release.yml@refs/tags/v*.
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Owner-authorized promotion of a verified tagged draft (false prepares only)"
        type: boolean
        default: false

permissions:
  contents: read # jobs escalate locally

jobs:
  # ── 0. Truth gate: a release is evidence-bound or it does not ship ─────────
  gates:
    name: Release gates (identity + claims + channels + unit floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog generator needs history + tags
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      # desktop/ is an independent installation (own lockfile, by design);
      # `bun run typecheck` (P1-16 preflight) fails without it — ci.yml's
      # typecheck lane has always installed this step first.
      - name: Install desktop dependencies (frozen lockfile)
        working-directory: desktop
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Identity + claim + channel gates
        run: |
          bun run release:check
          bun run claim-lint
          bun run channel:check
          bun run typecheck
      - name: Behavioral security + deterministic agent smoke (real Linux isolation required)
        run: bun run security:check --out security-gate.json
      - name: Parity manifest validates
        run: bun run scripts/platform-parity.ts --validate
      - name: Test floor (supply chain + trust + security + release)
        run: bun test test/supply-chain test/trust test/security test/daemon test/release test/update

  # ── 1. Canonical per-target builds with native smoke ───────────────────────
  build:
    needs: [gates]
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-24.04, targets: "linux-x64,linux-arm64", smoke: "linux-x64" }
          - { name: darwin, os: macos-latest, targets: "darwin-arm64,darwin-x64", smoke: "darwin-arm64" }
          - { name: windows, os: windows-latest, targets: "windows-x64,windows-arm64", smoke: "windows-x64" }
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build targets + native smoke
        run: bun run scripts/build-matrix.ts --targets ${{ matrix.targets }} --out dist
      - name: Package windows as portable zip (winget/scoop canonical asset)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/zip | Out-Null
          Copy-Item dist/xr-windows-x64.exe dist/zip/xr.exe
          Compress-Archive -Path dist/zip/xr.exe -DestinationPath dist/xr-windows-x64.zip -Force
          Remove-Item dist/zip/xr.exe
          Copy-Item dist/xr-windows-arm64.exe dist/zip/xr.exe
          Compress-Archive -Path dist/zip/xr.exe -DestinationPath dist/xr-windows-arm64.zip -Force
      - name: Upload canonical binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.name }}
          path: |
            dist/xr-*
          retention-days: 3

  # ── 2. Assemble the release: sums + SBOM + deb + changelog ────────────────
  assemble:
    name: Assemble (sums + SBOM + .deb + changelog)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [gates, build]
    permissions:
      contents: read
    outputs:
      digests: ${{ steps.subjects.outputs.base64 }}
      version: ${{ steps.version.outputs.value }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve release version + channel
        id: version
        run: |
          V="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("release.manifest.json","utf8")).identity.version)')"
          # gates validated tag == committed identity; dispatch never publishes.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "untagged dispatch — assembling committed manifest version $V only"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: Prerelease channel detection (semver suffix → prerelease)
        id: meta
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          if [[ "$V" == *"-"* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Download canonical binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true
      - name: Assert the full target set is present (one canonical build)
        run: |
          for f in xr-linux-x64 xr-linux-arm64 xr-darwin-arm64 xr-darwin-x64 xr-windows-x64.exe xr-windows-arm64.exe xr-windows-x64.zip xr-windows-arm64.zip; do
            test -f "dist/$f" || { echo "MISSING dist/$f"; exit 1; }
          done
      # Identity is committed and checked BEFORE building. Never mutate it
      # after native binaries have already embedded another version.
      - name: Verify committed identity remains unchanged
        run: bun run release:check
      - name: Pack the npm artifact + source archive
        run: |
          # `bun pm pack --pack-destination` is not honoured by every bun
          # version (1.3.x writes the tarball to the package root regardless),
          # which left dist/ without the .tgz and broke the SHA256SUMS step
          # below with "No such file or directory" on the rrrtx-xr-*.tgz glob —
          # after all three build jobs had already succeeded.
          # Pack, then MOVE the tarball explicitly and assert it landed.
          bun pm pack --pack-destination dist
          if ! ls dist/rrrtx-xr-*.tgz >/dev/null 2>&1; then
            mv rrrtx-xr-*.tgz dist/
          fi
          ls dist/rrrtx-xr-*.tgz >/dev/null 2>&1 || {
            echo "::error::npm tarball not found in dist/ after packing"
            ls -la . dist
            exit 1
          }
          git archive --format=tar.gz -o dist/xr-source.tar.gz HEAD
      - name: Assert the tarball ships no extracted satellite code (ADR-0028)
        # Phase 5 moved enterprise + business-os out of core. package.json#files
        # excludes them, but the published artifact is inspected rather than
        # trusted: a new directory can silently reintroduce 33k LOC of surface
        # into every user's install.
        run: |
          set -- dist/rrrtx-xr-*.tgz
          bun run scripts/consumer-smoke.ts --tarball "$1"
      - name: Build the .deb channel artifact from the canonical linux-x64 binary
        run: bun run scripts/build-deb.ts --bin dist/xr-linux-x64 --out dist/xr_${{ steps.version.outputs.value }}_amd64.deb
      - name: Generate the changelog from conventional commits (evidence-bound)
        run: |
          V="${{ steps.version.outputs.value }}"
          bun run scripts/changelog.ts --version "$V" --write
          git diff -- CHANGELOG.md
      - name: Generate CycloneDX SBOM (locked deps)
        run: bun run scripts/sbom.ts --out dist/sbom.cyclonedx.json --scope combined
      - name: Generate SHA256SUMS over every publishable artifact (incl. SBOM)
        # SBOM is generated FIRST so it is checksummed. Portable writer — no GNU sha256sum.
        run: bun run scripts/write-sums.ts dist
      - name: Project stable channel files for this artifact only and authenticate their bytes
        if: steps.meta.outputs.prerelease == 'false'
        env:
          V: ${{ steps.version.outputs.value }}
        run: |
          bun scripts/channel-manifest.ts --stamp --version "$V" --sums dist/SHA256SUMS --out channel-projection
          find channel-projection -type f -exec cp {} dist/ \;
          bun scripts/write-sums.ts dist
      - name: Emit SLSA subjects from the real artifact digests
        id: subjects
        run: |
          SUBJECTS="$(bun run scripts/write-sums.ts dist --print-with-manifest)"
          echo "$SUBJECTS"
          echo "base64=$(printf '%s' "$SUBJECTS" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            dist/
            CHANGELOG.md
          retention-days: 3

  # ── 3. Keyless signing (public Rekor) ─────────────────────────────────────
  sign:
    name: cosign keyless sign (Rekor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [assemble]
    permissions:
      contents: read
      id-token: write # GitHub OIDC → Fulcio
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: bundle
      - name: Flatten artifact into dist/ (upload-artifact v4 keeps the dist/ prefix)
        run: |
          mkdir -p dist
          if [ -f bundle/dist/SHA256SUMS ]; then
            cp -a bundle/dist/. dist/
          elif [ -f bundle/SHA256SUMS ]; then
            cp -a bundle/. dist/
          else
            echo "::error::SHA256SUMS not found in release-bundle"
            find bundle -maxdepth 4 -type f | head -50
            exit 1
          fi
          if [ -f bundle/CHANGELOG.md ] && [ ! -f dist/CHANGELOG.md ]; then
            cp bundle/CHANGELOG.md dist/CHANGELOG.md
          fi
          test -f dist/SHA256SUMS
          ls -la dist
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums + npm tarball + SBOM keylessly
        env:
          COSIGN_EXPERIMENTAL: "1"
        working-directory: dist
        run: |
          cosign sign-blob --yes SHA256SUMS --bundle SHA256SUMS.bundle
          for f in rrrtx-xr-*.tgz sbom.cyclonedx.json; do
            cosign sign-blob --yes "$f" --bundle "$f.bundle"
          done
      - name: Verify the checksum signature we just wrote (fail closed)
        env:
          COSIGN_EXPERIMENTAL: "1"
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate-identity-regexp 'https://github.com/ahmadrrrtx/xr/.github/workflows/release.yml@refs/tags/v.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --bundle SHA256SUMS.bundle \
            SHA256SUMS
      - name: Upload signed bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-bundle
          path: |
            dist/
            CHANGELOG.md
          retention-days: 3

  # ── 4. GitHub Release (assets + changelog notes) ──────────────────────────
  release:
    name: GitHub Release (signed assets)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [assemble, sign, provenance, verify-release, journey, supply-chain]
    permissions:
      contents: write
    steps:
      - name: Checkout exact tag for immutable draft guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun for draft guard
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Refuse to replace an already published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release-ci-evidence.ts --draft-only
      - name: Download signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-bundle
          path: bundle
      - name: Flatten artifact into dist/
        run: |
          mkdir -p dist
          if [ -f bundle/dist/SHA256SUMS ]; then cp -a bundle/dist/. dist/
          elif [ -f bundle/SHA256SUMS ]; then cp -a bundle/. dist/
          else echo "::error::SHA256SUMS missing"; find bundle -maxdepth 4 -type f | head -50; exit 1
          fi
          if [ -f bundle/CHANGELOG.md ] && [ ! -f dist/CHANGELOG.md ]; then cp bundle/CHANGELOG.md dist/CHANGELOG.md; fi
          test -f dist/SHA256SUMS
      - name: Download verified SLSA provenance for the draft assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Extract release notes for this version
        run: |
          V="${{ needs.assemble.outputs.version }}"
          awk -v v="## $V —" '
            index($0, v) == 1 { p=1; next }
            p && /^## [0-9]+\.[0-9]+\.[0-9]+/ { exit }
            p { print }
          ' dist/CHANGELOG.md > RELEASE-NOTES.md || true
          test -s RELEASE-NOTES.md || echo "Release $V — see CHANGELOG.md" > RELEASE-NOTES.md
      - name: Prepare verified PRIVATE draft (never publish on tag push)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          make_latest: false
          name: XR v${{ needs.assemble.outputs.version }}
          body_path: RELEASE-NOTES.md
          prerelease: ${{ needs.assemble.outputs.prerelease == 'true' }}
          # v1.0.0-beta.1 re-run deadlock (2026-09-03): the first failed run
          # left an asset-less release for the tag; every later run then died
          # with `already_exists` on finalize. overwrite: true makes the step
          # idempotent — an existing release for the tag is adopted, its
          # assets replaced, name/body refreshed.
          overwrite_files: true
          files: |
            dist/*
            provenance/*.intoto.jsonl
      # L-010: an incomplete release must be RED, not silently shipped. The
      # gate queries the live tag's assets against the canonical set (CLI
      # binaries + zips incl. windows-arm64, source, .deb, npm tarball +
      # cosign bundles, SHA256SUMS + bundle, SBOM + bundle, SLSA intoto) and
      # fails this run loudly instead of letting a partial release stand.
      - name: Checkout (for the asset-completeness gate script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun (asset-completeness gate)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Assert live release asset completeness (L-010)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/release-assets-check.ts --tag "$GITHUB_REF_NAME"

  # ── 5. SLSA3 provenance over the REAL digests (the Phase-4 fix) ───────────
  provenance:
    name: SLSA provenance (build level 3)
    if: github.ref_type == 'tag'
    needs: [assemble]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.assemble.outputs.digests }}
      upload-assets: false

  # ── 5b. XR-LAUNCH-012: the required PR checks re-run on the tag commit ─────
  # Publishing (npm, GHCR) needs these AND the live asset-completeness check
  # in `release` AND verify-release — a tag can no longer reach a registry
  # with an incomplete release or a failing journey.
  journey:
    name: Clean-machine journey (tag)
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/journey.yml
  supply-chain:
    name: Supply chain (tag)
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      security-events: write # the called scans upload SARIF
    uses: ./.github/workflows/supply-chain.yml

  # ── 6. npm channel (OIDC trusted publishing; candidate|beta; defaults promoted separately) ────────
  publish-npm:
    name: Publish npm (trusted publishing, provenance)
    if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [assemble, sign, release, verify-release, journey, supply-chain, promote]
    environment: npm-publish
    permissions:
      id-token: write # npm OIDC trusted publishing — no long-lived token
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # package.json prepublishOnly is `bun run release:check && bun run claim-lint`.
      # Without bun on PATH, npm publish exits 127 (first v1.0.0-beta.1 miss).
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      # npm CLI does the PUBLISH (not bun): bun's publish does not implement
      # npm's OIDC trusted-publishing handshake (oven-sh/bun#22423) and fails
      # with "missing authentication" even when id-token: write is granted.
      # Trusted publishing needs npm >= 11.5.1 on Node >= 22, so pin both.
      # NODE_AUTH_TOKEN is deliberately never set: an empty or present token
      # makes npm skip OIDC and fall back to token auth, which then 404s.
      - name: Setup Node (npm OIDC trusted publishing)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@12.2.1
          npm --version
      - name: Verify the same committed identity before npm publication
        run: bun run release:check
      - name: Download the exact signed npm payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-bundle
          path: audited
      - name: Publish with provenance (prerelease → beta dist-tag)
        run: |
          mapfile -t packs < <(find audited -type f -name 'rrrtx-xr-*.tgz')
          [ "${#packs[@]}" -eq 1 ] || { echo "::error::exactly one audited npm payload required"; exit 1; }
          if [ "${{ needs.assemble.outputs.prerelease }}" = "true" ]; then
            npm publish "${packs[0]}" --provenance --access public --tag beta
          else
            npm publish "${packs[0]}" --provenance --access public --tag candidate
          fi

  # ── 7. Docker channel (GHCR, attestations, cosign) ────────────────────────
  publish-docker:
    name: Publish Docker (GHCR + cosign sign)
    if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [assemble, sign, release, verify-release, journey, supply-chain, promote]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (version channels; prereleases never move latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=beta,enable=${{ needs.assemble.outputs.prerelease == 'true' }}
      - name: Build + push multi-arch image (SBOM + SLSA buildx attestations)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the pushed image digest keylessly (Rekor)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"

  # ── 8. Channel stamping from the SIGNED checksums (no channel drift) ──────
  verify-release:
    name: Verify signed artifacts (verify-release.ts)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [assemble, sign, provenance]
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download signed bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-bundle
          path: bundle
      - name: Flatten artifact into dist/
        run: |
          mkdir -p dist
          if [ -f bundle/dist/SHA256SUMS ]; then cp -a bundle/dist/. dist/
          elif [ -f bundle/SHA256SUMS ]; then cp -a bundle/. dist/
          else echo "::error::SHA256SUMS missing"; find bundle -maxdepth 4 -type f | head -50; exit 1
          fi
          test -f dist/SHA256SUMS
      - name: Download real SLSA provenance artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Install checksum-pinned SLSA verifier
        run: |
          curl -fsSL https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64 -o "$RUNNER_TEMP/slsa-verifier"
          echo "946dbec729094195e88ef78e1734324a27869f03e2c6bd2f61cbc06bd5350339  $RUNNER_TEMP/slsa-verifier" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/slsa-verifier"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: verify-release.ts against the signed npm tarball + SBOM + sums
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -- dist/rrrtx-xr-*.tgz
          ART="$1"
          bun run scripts/verify-release.ts \
            --strict --expected-version "${{ needs.assemble.outputs.version }}" \
            --provenance "$(find provenance -name '*.intoto.jsonl' -type f -print -quit)" \
            --slsa-source-uri "github.com/${{ github.repository }}" --slsa-source-tag "$GITHUB_REF_NAME" \
            --artifact "$ART" \
            --sums dist/SHA256SUMS \
            --sbom dist/sbom.cyclonedx.json \
            --cosign-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"

  # ── 10. Consumer smoke: the published npm artifact is the audited one ─────
  consumer-smoke:
    name: Consumer smoke (fresh npm install)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [publish-npm, assemble]
    permissions:
      contents: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Smoke the just-published package in a clean XR_HOME
        run: bun run scripts/consumer-smoke.ts --from-npm ${{ needs.assemble.outputs.version }}


  native-evidence:
    name: Exact-tag native desktop evidence (owner promotion only)
    if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Require completed signed native packaging + journeys for THIS commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/release-ci-evidence.ts --wait-seconds 7200

  promote:
    name: Owner-authorized public promotion (never automatic)
    if: github.ref_type == 'tag' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [assemble, release, provenance, verify-release, journey, supply-chain, native-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Validate unchanged identity before versioned publication
        run: |
          bun scripts/release-manifest.ts --check
      - name: Publish the verified draft only after explicit owner dispatch and all gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="${{ needs.assemble.outputs.prerelease }}" --latest=false
