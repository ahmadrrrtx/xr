# =============================================================================
# XR Phase 4 · T6 — Supply-chain scanning (every PR + nightly)
#
# Gates the release pipeline with independent evidence:
#   1. secret scanning   — gitleaks over the whole tree (no committed secrets)
#   2. vuln scanning     — osv-scanner (binary, checksum-pinned) over the LOCKED
#                          dependency set + `bun audit` (registry advisories)
#                          NOTE: `npm audit` requires package-lock.json, which
#                          this repo does not use (Bun lockfile) — bun audit is
#                          the equivalent and verified working.
#   3. license check     — scripts/license-check.ts (forbidden/unknown licenses)
#   4. SBOM              — CycloneDX generation + drift guard (reproducible)
#   5. container scan    — trivy over the shipped image (Dockerfile). The image
#                          runs `apk upgrade --no-cache` at build time so the
#                          base image is patched on the day it is built.
#   6. install hygiene   — bun install --frozen-lockfile --ignore-scripts
#                          (no dependency install scripts ever run in CI)
#
# SLSA provenance + cosign keyless signing happen in release.yml on tagged
# releases; the verification path is exercised by test/supply-chain/.
# =============================================================================
name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # nightly
  workflow_dispatch:
  # release.yml re-runs this on the tag commit before publishing (XR-LAUNCH-012).
  workflow_call:

permissions:
  contents: read

jobs:
  install-hygiene:
    name: Install hygiene (--ignore-scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install with --ignore-scripts (no dependency scripts ever run)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Lockfile is authoritative (no drift)
        run: bun install --frozen-lockfile --ignore-scripts --dry-run

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITLEAKS_LICENSE: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  vuln-scan:
    name: Vulnerability scan (osv-scanner + bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # CodeQL upload-sarif posts findings to the security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (ignore-scripts, frozen)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: OSV scanner (locked deps, checksum-pinned binary)
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          # Exits non-zero when vulnerabilities are found (the gate).
          /tmp/osv-scanner -r --format sarif --output-file osv-results.sarif .
      - name: Upload OSV SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: osv-results.sarif
      - name: bun audit (registry advisories, locked deps)
        run: bun audit

  license-scan:
    name: License scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (ignore-scripts, frozen)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: License check (forbidden/unknown fail the gate)
        run: bun run scripts/license-check.ts

  sbom:
    name: SBOM (CycloneDX) + drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Generate SBOM from the locked dependency set
        run: bun run scripts/sbom.ts --out sbom.cyclonedx.json
      - name: SBOM is valid CycloneDX with pinned hashes
        run: bun test test/supply-chain/supply-chain.test.ts
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  tag-npm-invariant:
    name: tag ⇔ npm invariant (1.x line)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need tags
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (ignore-scripts, frozen)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Assert 1.x git tags match 1.x npm versions
        # Vacuous pass until the first 1.x publish. Historical v3/v4/v7 tags
        # are out of band (docs/HISTORY.md). --skip-if-unpublished is the
        # weekly-lane analog; here we still run the invariant (vacuous ok).
        run: bun run scripts/tag-npm-invariant.ts --skip-if-unpublished

  container-scan:
    name: Container image scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write # CodeQL upload-sarif posts findings to the security tab
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the shipped image
        run: docker build -t xr:scan .
      # XR-LAUNCH-020: the image must actually run XR and its file tools. The
      # filesystem authority dlopens glibc's libc.so.6; on a musl base it fails
      # closed and every read_file/write_file would be refused.
      - name: Container smoke — xr --version + real file tools (glibc authority)
        run: |
          docker run --rm xr:scan --version
          docker run --rm --entrypoint bun xr:scan run scripts/container-file-smoke.ts
      - name: Trivy image scan (high/critical gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: xr:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # XR-LAUNCH-012 (D7): the ONE check branch protection requires for this
  # workflow (.github/required-checks.json). It fails unless every job it
  # needs succeeded — a skipped or cancelled job is not a pass.
  supply-chain-gate:
    name: Supply Chain gate
    if: always()
    needs: [install-hygiene, secret-scan, vuln-scan, license-scan, sbom, tag-npm-invariant, container-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job ended '$r'"; exit 1; }; done
