# =============================================================================
# XR Desktop (Phase 4 · D-02) — Tauri v2 packaging matrix.
#
# "First-class on Windows + macOS + Linux" means BUNDLED, not "imports
# compile". This lane proves the shell builds real installers on all three
# OS families from one source:
#
#   1. shell-check  — cargo check + clippy (-D warnings) + cargo test against
#                     the real WebKit2GTK 4.1 headers (Linux reference runner).
#   1b. shell-test-windows — cargo test on windows-latest: the #[cfg(windows)]
#                     code (W-1/W-2) compiled AND its runtime tests run
#                     against a real kernel. Linux never compiles that code.
#                     (W-3 single instance is tauri-plugin-single-instance
#                     since b027ad4; the hand-written mutex and its test went.)
#   2. sidecar      — the XR engine compiled standalone (bun build --compile,
#                     scripts/compile-sidecar.ts = ONE computation source for
#                     CI and local dev) and SMOKE-TESTED for real: --version,
#                     then `serve --port 39417` + authenticated-loop health
#                     probe. A bundle never ships an engine that didn't boot.
#   3. bundle       — full `tauri build` per OS (externalBin sidecar included):
#                     deb/rpm/AppImage (Linux), dmg/app (macOS arm64), msi +
#                     nsis per-user (Windows, both asserted). Artifacts are
#                     uploaded; a run is green only if bundles exist
#                     (if-no-files-found: error — no silent empty success).
#
# Icons are generated from the OFFICIAL avatar render (D-05: format
# conversion only, every pixel from the owner-supplied original — no
# derived geometry), committed at desktop/src-tauri/icons.
#
# Unsigned builds: code-signing/notarization keys are owner secrets and are
# deliberately NOT referenced here; artifacts are honest "CI builds".
# =============================================================================
name: Desktop App (Tauri packaging)

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      # Phase 27: the shell's packaging artefacts (flatpak manifest, AppStream
      # metadata, MSIX tiles) and the tests that pin them live outside desktop/.
      # Without these two lines a PR that only edits the Flatpak manifest would
      # change shipped packaging with no CI at all.
      - "packaging/**"
      - "test/desktop/**"
      - ".github/workflows/desktop-app.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "packaging/**"
      - "test/desktop/**"
      - ".github/workflows/desktop-app.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-check:
    name: Rust shell — cargo check + clippy (Linux reference)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux system dependencies (WebKit2GTK 4.1 + tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install engine dependencies
        run: bun install --frozen-lockfile
      # Sidecar MUST exist before cargo check: tauri-build validates
      # bundle.externalBin paths at build-script time.
      - name: Compile engine sidecar (single source — scripts/compile-sidecar.ts)
        run: bun run scripts/compile-sidecar.ts
      - name: Smoke-test the sidecar (real boot + health probe)
        run: bash scripts/smoke-sidecar.sh x86_64-unknown-linux-gnu
      - name: cargo check (all targets)
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --all-targets
      - name: cargo clippy (-D warnings)
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      # `cargo check --all-targets` only type-checks the unit tests; until this
      # step existed, engine_state.rs's tests (banner parsing, bounded stderr
      # tail, probe-cache expiry) had never actually RUN in CI.
      - name: cargo test (shell unit tests)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib -- --nocapture
      - name: Install desktop (renderer) dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      # Phase 27 — the shell's own surface: tray/menu/lifecycle values, the
      # generated tray + MSIX artefacts, and the crash-report redaction rules.
      # `--inspect` also prints the master-icon geometry, so a master whose
      # artwork moved shows up in the log instead of only in a test diff.
      - name: Tray icon geometry (master icon derivation)
        run: bun run scripts/generate-tray-icons.ts --inspect
      - name: Shell tests (tray artefacts, MSIX tiles, IPC contracts)
        run: bun test test/desktop/
      - name: Renderer typecheck + lint
        working-directory: desktop
        run: |
          bunx tsc --noEmit
          bunx eslint .
      # XR-LAUNCH-009 — the production renderer must carry no demo data. Seed
      # generators sit behind `import.meta.env.DEV`; this builds the real
      # production bundle and greps it for content only the seeds produce.
      - name: Production renderer build has no demo data (XR-LAUNCH-009)
        run: |
          (cd desktop && bunx vite build --outDir "$RUNNER_TEMP/desktop-dist")
          bun run scripts/desktop-seed-gate.ts "$RUNNER_TEMP/desktop-dist"

  # ── Windows runtime proof ────────────────────────────────────────────────────
  # Everything under `#[cfg(windows)]` (W-1 CREATE_NO_WINDOW, W-2 job-object
  # containment, W-3 named-mutex single instance) is invisible to the Linux
  # reference job above: it is not compiled there at all. This job compiles it
  # AND runs win.rs's tests against a real Windows kernel — a job whose last
  # handle closes must kill its member process tree (with a control case).
  # Until this job was green the honest status of W-1/W-2 was "implemented,
  # not runtime-verified".
  shell-test-windows:
    name: Rust shell — cargo test on Windows (W-1/W-2 runtime proof)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install engine dependencies
        run: bun install --frozen-lockfile
      # Same precondition as the Linux job: tauri-build validates externalBin.
      - name: Compile engine sidecar (x86_64-pc-windows-msvc)
        env:
          SIDECAR_TRIPLE: x86_64-pc-windows-msvc
        run: bun run scripts/compile-sidecar.ts
      - name: Smoke-test the sidecar (real boot + health probe)
        shell: bash
        run: bash scripts/smoke-sidecar.sh x86_64-pc-windows-msvc
      - name: cargo test (win.rs runtime tests + shell unit tests)
        env:
          RUSTFLAGS: -D warnings
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib -- --nocapture

  bundle:
    name: ${{ matrix.osName }} — tauri bundle
    needs: [shell-check, shell-test-windows]
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 90
    permissions:
      contents: write # attach installers to the release on tag runs (read-only elsewhere in effect)
    strategy:
      fail-fast: false
      matrix:
        # Launch-audit L-002/L-003: the matrix now ships leg for EVERY launch
        # triple. Per-leg `slug` (not `runsOn`) names artifacts: two legs
        # share macos-latest, so runsOn-named artifacts would silently collide.
        include:
          - { osName: "Linux", runsOn: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, slug: linux-x64, targetDir: target/release }
          - { osName: "macOS (arm64)", runsOn: macos-latest, triple: aarch64-apple-darwin, slug: darwin-arm64, targetDir: target/release }
          # Intel mac: cross-compiled on the arm runner. The engine sidecar is
          # a REAL bun --target build (never a rename), the Rust cross target is
          # added below, and cross builds land under target/<triple>/release —
          # a 'target/release' bundle path is the exact "green but nothing
          # built there" trap the first cut of this leg hit. Runtime smoke is
          # honestly skipped (cross binary can't run on an arm host).
          - { osName: "macOS (x64)", runsOn: macos-latest, triple: x86_64-apple-darwin, slug: darwin-x64, tauriArgs: "--target x86_64-apple-darwin", targetDir: target/x86_64-apple-darwin/release }
          - { osName: "Windows", runsOn: windows-latest, triple: x86_64-pc-windows-msvc, slug: windows-x64, targetDir: target/release }
          # Windows ARM: native ARM runner so the sidecar RUNS on-target, and
          # NSIS only — only NSIS supports ARM64 bundling in Tauri v2.
          - { osName: "Windows (arm64)", runsOn: windows-11-arm, triple: aarch64-pc-windows-msvc, slug: windows-arm64, tauriArgs: "--bundles nsis", targetDir: target/release }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # desktop/bun.lock is lockfileVersion 2 (written by bun 1.4.x) —
          # older bun fails with "Unknown lockfile version" on --frozen-lockfile.
          bun-version: 1.4.2
      - name: Install Linux system dependencies (WebKit2GTK 4.1 + tray)
        if: matrix.runsOn == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Add the x86_64 cross target (Intel-mac leg only)
        if: matrix.slug == 'darwin-x64'
        run: rustup target add x86_64-apple-darwin
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile
      - name: Install engine dependencies
        run: bun install --frozen-lockfile
      - name: Compile engine sidecar (externalBin for this triple)
        env:
          SIDECAR_TRIPLE: ${{ matrix.triple }}
        run: bun run scripts/compile-sidecar.ts
      - name: Smoke-test the sidecar (real boot + health probe)
        shell: bash
        run: bash scripts/smoke-sidecar.sh ${{ matrix.triple }}
      - name: Build bundles (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Phase 5 · signed updater artifacts. Empty secret ⇒ tauri build
          # emits no .sig files ⇒ the manifest job publishes nothing (honest).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
        with:
          projectPath: desktop
          args: --verbose ${{ matrix.tauriArgs }}
      - name: List produced bundles
        shell: bash
        run: find desktop/src-tauri/${{ matrix.targetDir }}/bundle -maxdepth 3 -type f | sort
      - name: Assert Linux bundles (deb + rpm + AppImage)
        if: matrix.runsOn == 'ubuntu-22.04'
        shell: bash
        run: |
          set -e
          deb=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/deb -name '*.deb' | wc -l)
          rpm=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/rpm -name '*.rpm' | wc -l)
          appimage=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage -name '*.AppImage' | wc -l)
          echo "deb=${deb} rpm=${rpm} appimage=${appimage}"
          test "$deb"      -ge 1 || { echo "::error::no .deb produced";      exit 1; }
          test "$rpm"      -ge 1 || { echo "::error::no .rpm produced";      exit 1; }
          test "$appimage" -ge 1 || { echo "::error::no .AppImage produced"; exit 1; }
      - name: Assert macOS bundles (dmg + .app)
        if: matrix.runsOn == 'macos-latest'
        shell: bash
        run: |
          set -e
          dmg=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/dmg -name '*.dmg' | wc -l)
          # Tauri leaves ONLY the tarball here (XR.app.tar.gz) — the unpacked
          # .app is not written to disk. Assert what actually ships, or this
          # check fails on a healthy build.
          app=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos -maxdepth 2 \( -name '*.app' -type d -o -name '*.app.tar.gz' -type f \) | wc -l)
          echo "dmg=${dmg} app=${app}"
          test "$dmg" -ge 1 || { echo "::error::no .dmg produced"; exit 1; }
          test "$app" -ge 1 || { echo "::error::no .app produced"; exit 1; }
      # Sidecar architecture must match the bundle it ships inside. A runner
      # that cross-compiles Rust but not the engine would otherwise ship an
      # arm64 binary named `xr-engine-x86_64-apple-darwin` — the exact silent
      # mismatch scripts/compile-sidecar.ts warns it does not claim to prevent.
      - name: Assert the sidecar matches the bundle architecture
        shell: bash
        run: |
          set -e
          bin="desktop/src-tauri/binaries/xr-engine-${{ matrix.triple }}"
          [ -f "$bin" ] || bin="${bin}.exe"
          test -f "$bin" || { echo "::error::sidecar missing: $bin*"; exit 1; }
          case "${{ matrix.triple }}" in
            aarch64-apple-darwin)   want="arm64" ;;
            x86_64-apple-darwin)    want="x86_64" ;;
            x86_64-unknown-linux-gnu) want="ELF" ;;
            *) echo "no arch check for ${{ matrix.triple }}"; exit 0 ;;
          esac
          if [ "$want" = "ELF" ]; then
            file "$bin" | grep -q 'ELF' || { echo "::error::sidecar is not ELF"; exit 1; }
          else
            file "$bin" | grep -q "$want" || {
              echo "::error::sidecar is $(file "$bin") but the bundle wants $want"; exit 1; }
          fi
          echo "sidecar arch OK for ${{ matrix.triple }}"
      # Windows ships TWO flavours on purpose (03-WINDOWS-ROOT-CAUSE, W-4):
      #   msi   — per-machine, what existing installs already have (kept so an
      #           MSI-installed user keeps the MSI upgrade path)
      #   nsis  — per-user (installMode: currentUser): no UAC prompt, the path
      #           the updater and winget `Scope: user` expect. This assertion
      #           makes a silently-missing flavour a red run, not a surprise at
      #           release time.
      - name: Assert both Windows installer flavours exist (msi + nsis per-user)
        if: matrix.runsOn == 'windows-latest'
        shell: bash
        run: |
          set -e
          msi=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi -name '*.msi' | wc -l)
          nsis=$(find desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis -name '*-setup.exe' | wc -l)
          echo "msi=${msi} nsis=${nsis}"
          test "$msi" -ge 1 || { echo "::error::no .msi produced"; exit 1; }
          test "$nsis" -ge 1 || { echo "::error::no NSIS *-setup.exe produced"; exit 1; }
      # Windows ARM leg (L-002): only NSIS supports ARM64 bundling, so this
      # leg passes --bundles nsis and asserts EXACTLY that flavour (msi would
      # be a cross-arch silence hazard, not a deliverable).
      - name: Assert Windows ARM installer exists (nsis only)
        if: matrix.slug == 'windows-arm64'
        shell: bash
        run: |
          set -e
          nsis=$(find desktop/src-tauri/target -path '*/bundle/nsis/*-setup.exe' | wc -l)
          echo "nsis=${nsis}"
          test "$nsis" -ge 1 || { echo "::error::no NSIS *-setup.exe produced for windows-arm64"; exit 1; }
      # Phase 27 — MSIX. Tauri 2.12 has no `msix` bundle target, so the built
      # app directory is wrapped by packaging/windows/msix/build-msix.ps1. The
      # script fails loudly when the engine sidecar is missing (an installable
      # package with no engine is worse than no package), and the artifact is
      # signed with a self-signed test certificate so the .cer can be trusted
      # explicitly by a tester. Store submission is out of scope.
      - name: Package MSIX (test-signed)
        if: matrix.runsOn == 'windows-latest'
        shell: pwsh
        run: |
          # The version comes from tauri.conf.json, never from github.ref_name:
          # on a pull request the ref is `175/merge`, and an MSIX Identity
          # Version must be dotted numerics — that mismatch is a failed package,
          # not a warning.
          $conf = Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $conf.version
          Write-Host "packaging MSIX for XR $version"
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject 'CN=Muhammad Ahmad, O=Muhammad Ahmad, C=PK' `
            -KeyUsage DigitalSignature `
            -FriendlyName 'XR local test signing' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
            -CertStoreLocation Cert:\CurrentUser\My
          # Not `$pwd`: that is PowerShell's automatic working-directory
          # variable, and assigning to it leaves the password parameter holding
          # a path (SecureString conversion then fails at signing time).
          $certPassword = ConvertTo-SecureString -String 'xr-msix-test' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'xr-test.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $certPassword | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'xr-test.cer') | Out-Null
          # `&`, not `pwsh <script>`: a child pwsh process receives its
          # arguments over a command line, which flattens the SecureString to
          # the literal text "System.Security.SecureString". The -CertPassword
          # bind then dies with "Cannot convert the value of type System.String
          # to type System.Security.SecureString" — an error that names neither
          # the process boundary nor the real cause. `&` keeps it in-process.
          & ./packaging/windows/msix/build-msix.ps1 `
            -AppDir desktop/src-tauri/target/release `
            -Version $version `
            -OutDir desktop/src-tauri/${{ matrix.targetDir }}/bundle/msix `
            -Sign -CertPath $pfx -CertPassword $certPassword
          $out = 'desktop/src-tauri/${{ matrix.targetDir }}/bundle/msix'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'xr-test.cer') $out -Force
          Get-ChildItem $out | Format-Table Name,Length
      - name: Upload MSIX
        if: matrix.runsOn == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xr-msix-${{ matrix.slug }}
          if-no-files-found: error
          path: desktop/src-tauri/${{ matrix.targetDir }}/bundle/msix/*

      # Portable, no-install flavour: exe + engine sidecar side by side
      # (sidecar_path() resolves the triple-suffixed name next to the exe).
      # For users whose machines refuse installers — and for first-launch
      # forensics without touching the installed app.
      - name: Assemble portable (no-install) zip for Windows
        if: matrix.runsOn == 'windows-latest'
        shell: bash
        run: |
          set -e
          mkdir -p desktop/src-tauri/${{ matrix.targetDir }}/bundle/portable/xr-portable
          cp "desktop/src-tauri/target/release/xr-desktop.exe" desktop/src-tauri/${{ matrix.targetDir }}/bundle/portable/xr-portable/
          cp desktop/src-tauri/binaries/xr-engine-x86_64-pc-windows-msvc.exe desktop/src-tauri/${{ matrix.targetDir }}/bundle/portable/xr-portable/
          (cd desktop/src-tauri/${{ matrix.targetDir }}/bundle/portable && tar -a -c -f ../xr-portable-win.zip xr-portable)
          ls -la desktop/src-tauri/${{ matrix.targetDir }}/bundle/xr-portable-win.zip
      - name: Upload portable artifact
        if: matrix.runsOn == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xr-portable-${{ matrix.slug }}
          if-no-files-found: error
          path: desktop/src-tauri/${{ matrix.targetDir }}/bundle/xr-portable-win.zip
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xr-desktop-${{ matrix.slug }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/deb/*.deb
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/rpm/*.rpm
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage/*.AppImage
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/dmg/*.dmg
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos/*.app.tar.gz
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi/*.msi
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis/*-setup.exe
      # Tauri v2 updater artifacts (`createUpdaterArtifacts: true`): the
      # installer IS the payload, with a detached .sig next to it. The payloads
      # travel with the sigs so the manifest job can refuse an orphan .sig.
      - name: Upload updater signature artifacts (present only when provisioned)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: xr-updater-sigs-${{ matrix.slug }}
          if-no-files-found: ignore
          path: |
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage/*.AppImage
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos/*.app.tar.gz
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi/*.msi
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi/*.msi.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis/*-setup.exe
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis/*-setup.exe.sig
      # Until this step existed the installers were WORKFLOW artifacts only —
      # nothing ever attached them to the GitHub release, so every URL
      # latest.json pointed at was a 404 by construction. GitHub renames the
      # assets on upload (spaces → periods); make-updater-manifest.ts mirrors that.
      - name: Attach installers (+ .sig when provisioned) to the GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/deb/*.deb
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/rpm/*.rpm
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage/*.AppImage
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/dmg/*.dmg
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos/*.app.tar.gz
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/macos/*.app.tar.gz.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi/*.msi
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/msi/*.msi.sig
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis/*-setup.exe
            desktop/src-tauri/${{ matrix.targetDir }}/bundle/nsis/*-setup.exe.sig

  # ── Phase 5 · signed-updater manifest (guarded: needs the operator secret) ──
  # ── Flatpak (Phase 27) ───────────────────────────────────────────────────────
  # Two different questions, two different answers:
  #
  #   · Is the metadata valid?  REQUIRED on every PR. `desktop-file-validate`
  #     and `appstreamcli validate` are federated specifications, not opinions —
  #     and they are the only thing that caught `Categories=...;AI;...` (AI is
  #     not a registered category) and a `--` inside an XML comment, which made
  #     the metainfo unparseable. Both are now pinned by
  #     test/desktop/flatpak-metainfo.test.ts as well.
  #   · Does it BUILD? A from-source flatpak-builder run needs the GNOME runtime
  #     and a vendored cargo/npm source set, and it takes tens of minutes. It runs
  #     on workflow_dispatch, where it is expected to answer, not to decorate the
  #     job list. On a PR it is skipped rather than left red for reasons no PR
  #     author can act on.
  flatpak:
    name: Linux — Flatpak metadata (required) + build (workflow_dispatch)
    # 24.04, not 22.04, for one specific reason: the AppStream CLI on 22.04 is
    # from 2022 and does not know the modern tags this metadata uses — it reports
    # `<developer>` as an unknown tag and `url type="vcs-browser"` as invalid,
    # and its "warning" exit code fails the job on metadata that Flathub's
    # current validator accepts. Validating with a decade-old parser would push
    # us to write 2015-shaped metadata. Flathub runs a current appstreamcli; so
    # does this job, and it prints the version it used.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install desktop-entry + AppStream validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          appstreamcli --version
          desktop-file-validate --version

      - name: Validate the desktop entry (registered categories only)
        run: desktop-file-validate packaging/flatpak/ai.rrrtx.xr-desktop.desktop

      - name: Validate the AppStream metadata (offline, deterministic)
        run: appstreamcli validate --no-net packaging/flatpak/ai.rrrtx.xr-desktop.metainfo.xml

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # The manifest is checked by the same test that runs locally, so CI and
      # `bun test test/desktop/` can never disagree about what is required:
      # GNOME runtime (webkit2gtk-4.1), home but never host, checksummed sources
      # pinned to .bun-version, no reintroduced `npm ci`, sidecar next to the
      # shell under /app/bin.
      - name: Validate the manifest (shared with the unit suite)
        run: bun test test/desktop/flatpak-metainfo.test.ts

      - name: Install flatpak + builder + the GNOME runtime
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.gnome.Platform//46 org.gnome.Sdk//46 \
            org.freedesktop.Sdk.Extension.rust-stable//46 \
            org.freedesktop.Sdk.Extension.node22//46

      # Report-only is deliberately NOT set: dispatching this workflow is a
      # request for the answer, so a failure here is red on purpose.
      - name: Build the Flatpak from source
        if: github.event_name == 'workflow_dispatch'
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            flatpak-build packaging/flatpak/ai.rrrtx.xr-desktop.yml
          flatpak --user remote-add --if-not-exists xr-local flatpak-repo --no-gpg-verify
          flatpak --user install -y xr-local ai.rrrtx.xr-desktop
          flatpak run --command=sh ai.rrrtx.xr-desktop -c 'test -x /app/bin/xr-desktop'

      - name: Upload the Flatpak repo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xr-flatpak
          if-no-files-found: error
          path: flatpak-repo

  updater-manifest:
    name: Assemble + publish latest.json (only when updater keys provisioned)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [bundle]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Download signed updater artifacts
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: xr-updater-sigs-*
          path: updater-artifacts
          merge-multiple: true
      - name: Assemble latest.json
        run: |
          bun run scripts/make-updater-manifest.ts \
            --dir updater-artifacts --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" \
            --notes "Release $GITHUB_REF_NAME — see CHANGELOG.md" --out latest.json
          test -f latest.json
          if [ "$(python3 -c 'import json;print(len(json.load(open("latest.json"))["platforms"]))')" = "0" ]; then
            echo "::warning::no signed updater artifacts — skipping publish (updater not provisioned)"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Publish latest.json to the release
        if: env.SKIP != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: latest.json
