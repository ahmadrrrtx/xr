# =============================================================================
# Launch audit XR-LAUNCH-001 — publish package-manager channels for ONE release.
#
# Run this (owner, workflow_dispatch) after a release's GitHub assets, npm and
# Docker are verified, to bring Homebrew and WinGet to the same version:
#
#   1. verify    download SHA256SUMS + its cosign bundle and the stamped channel
#                files from the GitHub release; verify the keyless signature
#                (identity = this repo's release.yml on a v* tag); check every
#                channel file is pinned to the version and matches the sums.
#   2. homebrew  push Formula/xr.rb to the tap (secret TAP_GITHUB_TOKEN, scoped
#                to the tap repo only), then `brew install <tap>/xr` on macOS
#                and assert `xr --version`.
#   3. winget    submit the three verified manifests using bounded GitHub Git
#                Data/PR APIs (secret WINGET_TOKEN in headers, never argv).
#                New packages need moderator review before `winget install` works.
#   4. live      report `bun run channel:live` for the version (winget stays
#                pending until the community PR merges).
#
# Nothing here rebuilds or re-stamps artifacts: it only publishes bytes that
# the tag-triggered release workflow already produced and signed.
# =============================================================================
name: Publish Channels

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (X.Y.Z, must already be a full GitHub release)"
        required: true
        type: string
      defaults:
        description: "Promote verified stable npm/GHCR/GitHub defaults (requires publicVersion authority + owner tokens)"
        type: boolean
        default: false
      homebrew:
        description: "Push the formula to the Homebrew tap"
        type: boolean
        default: true
      winget:
        description: "Submit the manifests to microsoft/winget-pkgs"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-channels-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify signed channel files for v${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tap: ${{ steps.meta.outputs.tap }}
      tap_name: ${{ steps.meta.outputs.tap_name }}
      winget_id: ${{ steps.meta.outputs.winget_id }}
      winget_dir: ${{ steps.meta.outputs.winget_dir }}
    steps:
      - name: Validate the version input
        env:
          V: ${{ inputs.version }}
        run: |
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be a stable X.Y.Z (got '$V')"; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Resolve channel identities from release.manifest.json
        id: meta
        env:
          V: ${{ inputs.version }}
        run: |
          # shellcheck disable=SC2016 # a single-quoted JavaScript program for bun -e
          bun -e '
            const m = JSON.parse(require("fs").readFileSync("release.manifest.json", "utf8"));
            const c = m.channels;
            if (!c) { console.error("release.manifest.json has no channels block"); process.exit(1); }
            const id = c.wingetPackageId;
            const dir = `manifests/${id[0].toLowerCase()}/${id.split(".").join("/")}/${process.env.V}`;
            const out = [
              `tap=${c.homebrewTap}`,
              `tap_name=${c.homebrewTap.replace("/homebrew-", "/")}`,
              `winget_id=${id}`,
              `winget_dir=${dir}`,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
            console.log(out);
          '
      - name: Download the release's sums, signature and channel files
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
          WINGET_ID: ${{ steps.meta.outputs.winget_id }}
        run: |
          mkdir -p assets
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease \
            --jq 'if .isDraft or .isPrerelease then error("v'"$V"' is a draft or pre-release; publish channels only for full releases") else "release ok" end'
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern SHA256SUMS --pattern SHA256SUMS.bundle \
            --pattern xr.rb --pattern xr.json \
            --pattern "$WINGET_ID.yaml" --pattern "$WINGET_ID.installer.yaml" --pattern "$WINGET_ID.locale.en-US.yaml"
          ls -la assets
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the keyless signature over SHA256SUMS (fail closed)
        run: |
          cosign verify-blob \
            --bundle assets/SHA256SUMS.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v${{ inputs.version }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            assets/SHA256SUMS
      - name: Require same-tag native release evidence before any package-manager submission
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$V" --jq .sha)"
          bun scripts/release-ci-evidence.ts --tag "v$V" --sha "$sha"
      - name: Verify channel files are pinned and match the signed sums
        env:
          V: ${{ inputs.version }}
        run: bun run scripts/channel-publish-verify.ts --version "$V" --dir assets --sums assets/SHA256SUMS --out publish
      - name: Upload verified channel files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-channels
          path: publish
          if-no-files-found: error

  homebrew:
    name: Homebrew tap → v${{ inputs.version }}
    needs: verify
    if: inputs.homebrew
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "::error::secret TAP_GITHUB_TOKEN is not set (fine-grained token, contents:write on ${{ needs.verify.outputs.tap }} only)"; exit 1; }
      - name: Download verified channel files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-channels
          path: publish
      - name: Push Formula/xr.rb to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          TAP_REPO: ${{ needs.verify.outputs.tap }}
          V: ${{ inputs.version }}
        run: |
          git -c credential.helper='!gh auth git-credential' clone "https://github.com/${TAP_REPO}.git" tap
          git -C tap config user.name "xr-release-bot"
          git -C tap config user.email "release-bot@users.noreply.github.com"
          mkdir -p tap/Formula
          cp publish/homebrew/Formula/xr.rb tap/Formula/xr.rb
          cd tap
          if git diff --quiet && git ls-files --error-unmatch Formula/xr.rb >/dev/null 2>&1; then
            echo "tap already serves v$V"
          else
            git add Formula/xr.rb
            git commit -m "xr $V (from signed SHA256SUMS of ${GITHUB_REPOSITORY}@v$V)"
            git -c credential.helper='!gh auth git-credential' push origin HEAD
          fi

  homebrew-smoke:
    name: brew install from the tap (macOS)
    needs: [verify, homebrew]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Install, test, uninstall
        env:
          TAP_NAME: ${{ needs.verify.outputs.tap_name }}
          V: ${{ inputs.version }}
        run: |
          brew install "$TAP_NAME/xr"
          xr --version | tee /tmp/xr-version.txt
          grep -q "$V" /tmp/xr-version.txt
          brew test "$TAP_NAME/xr"
          brew uninstall xr
          brew untap "$TAP_NAME"

  winget:
    name: WinGet submission → v${{ inputs.version }}
    needs: verify
    if: inputs.winget
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require the WinGet token
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Error "secret WINGET_TOKEN is not set (classic PAT with public_repo; see docs/release/CHANNELS.md)"; exit 1 }
      - name: Download verified channel files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-channels
          path: publish
      - name: Checkout verified publisher implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Submit exact verified manifests without PAT argv or downloaded executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGET_ID: ${{ needs.verify.outputs.winget_id }}
          V: ${{ inputs.version }}
        run: bun scripts/publish-winget.ts --submit --id "$env:WINGET_ID" --version "$env:V" --root publish/winget --sums publish/SHA256SUMS

  live:
    name: Live channel report for v${{ inputs.version }}
    needs: [verify, homebrew, winget]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Report, not gate: a brand-new WinGet package stays pending until moderators
    # merge the community PR. The scheduled Channel Live workflow is the gate.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: channel:live (WinGet stays pending until the community PR merges)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ inputs.version }}
        run: bun run scripts/channel-live-check.ts --version "$V"

  defaults:
    name: Owner-authorized verified stable defaults (no rebuild)
    if: inputs.defaults
    needs: [verify]
    environment: release-channels
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
      - name: Require owner scope/authority before ANY default mutation
        env:
          V: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "::error::owner NPM_TOKEN required for dist-tag operations (OIDC publish is not dist-tag authorization)"; exit 1; }
          bun -e 'const m=require("./release.manifest.json"),v=process.env.V;if(m.channels.publicVersion!==v||m.identity.version!==v||m.identity.stability!=="stable")throw new Error("owner must first verify candidate and explicitly select matching stable publicVersion authority")'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$V" --jq .sha)"
          bun scripts/release-ci-evidence.ts --tag "v$V" --sha "$sha"
          npm install -g npm@12.2.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate the exact npm bytes and image digest before default changes
        env:
          V: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verify-defaults
          gh release download "v$V" --dir verify-defaults --pattern SHA256SUMS --pattern SHA256SUMS.bundle --pattern "rrrtx-xr-$V.tgz"
          cosign verify-blob --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$V" --certificate-oidc-issuer https://token.actions.githubusercontent.com --bundle verify-defaults/SHA256SUMS.bundle verify-defaults/SHA256SUMS
          FILE="rrrtx-xr-$V.tgz" bun -e 'import {parseSums} from "./scripts/verify-release";import {createHash} from "node:crypto";const f=process.env.FILE;const sums=parseSums(await Bun.file("verify-defaults/SHA256SUMS").text());const bytes=await Bun.file("verify-defaults/"+f).arrayBuffer();if(sums.get(f)!==createHash("sha256").update(Buffer.from(bytes)).digest("hex"))throw new Error("signed npm artifact mismatch")'
          url="$(npm view "@rrrtx/xr@$V" dist.tarball)"
          [[ "$url" == https://registry.npmjs.org/* ]] || { echo "::error::unexpected npm artifact host"; exit 1; }
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL --max-time 60 --max-filesize 67108864 "$url" -o verify-defaults/registry.tgz
          cmp "verify-defaults/rrrtx-xr-$V.tgz" verify-defaults/registry.tgz
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin the authenticated image digest (no mutable-tag race)
        env:
          V: ${{ inputs.version }}
        run: |
          cosign verify --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/v$V" --certificate-oidc-issuer https://token.actions.githubusercontent.com "ghcr.io/$GITHUB_REPOSITORY:$V" > image-proof.json
          digest="$(jq -r '.[0].critical.image["docker-manifest-digest"]' image-proof.json)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::verified image digest unavailable"; exit 1; }
          echo "VERIFIED_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Promote defaults from already verified immutable bytes (owner dispatch only)
        env:
          V: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm dist-tag add "@rrrtx/xr@$V" latest
          docker buildx imagetools create --tag "ghcr.io/$GITHUB_REPOSITORY:latest" "ghcr.io/$GITHUB_REPOSITORY@$VERIFIED_IMAGE_DIGEST"
          gh release edit "v$V" --latest=true
      - name: Verify actual default channels after promotion (partial failure is not atomic success)
        run: bun run channel:live
