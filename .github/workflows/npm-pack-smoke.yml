# =============================================================================
# Launch audit XR-LAUNCH-007 — the PACKED npm artifact works, per OS.
#
# `npm pack` → `npm install -g <tarball> --prefix <scratch>` → the package ships
# release.manifest.json → `xr --version` → `xr update --check` exits 0 and
# reports the running version (scripts/npm-pack-smoke.ts). This is the path a
# user on `npm i -g @rrrtx/xr` takes; 1.0.0 crashed on it (ENOENT on
# release.manifest.json, missing from package.json `files`).
# =============================================================================
name: npm Pack Smoke

on:
  # Required check (D7): no paths filter — it must report on every PR.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: npm pack + global install + xr update --check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun (the package launcher is `#!/usr/bin/env bun`)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Setup Node (npm)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Packed-tarball smoke (scratch prefix; never the runner's global npm)
        run: bun run scripts/npm-pack-smoke.ts

  # XR-LAUNCH-012 (D7): the ONE check branch protection requires for this
  # workflow (.github/required-checks.json). It fails unless every job it
  # needs succeeded — a skipped or cancelled job is not a pass.
  npm-pack-smoke-gate:
    name: npm Pack Smoke gate
    if: always()
    needs: [smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a required job ended '$r'"; exit 1; }; done
