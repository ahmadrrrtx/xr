# =============================================================================
# XR Phase 9 · T4 — Cross-platform CI at FULL PARITY.
#
# "Supported" means validated (Constitution Art. XX.4 + the Phase-9 contract):
# every tier-1 OS family runs the SAME tier as Linux — typecheck + the FULL
# unit suite + the golden path — on real runners, never a subset. Phase 1
# shipped a documented subset; Phase 9 graduates it to parity. The support
# matrix (docs/release/SUPPORT_MATRIX.md, stamped from the release manifest)
# names this workflow as its evidence.
#
# Platform exceptions are made INSIDE tests by runtime detection (Art. XX.5),
# never by directory exclusions here — config-level exclusion hides portability
# drift. Current detection-skips (whitelisted in test/release/portability.test.ts):
#   · test/reliability/crash-injection.test.ts — POSIX child-SIGKILL semantics.
#   · test/phase0/policy-gate-adversarial.test.ts — POSIX absolute-path corpus.
#   · test/phase0/cli-spine.test.ts — spawns the built CLI; doctor --json not
#     asserted on win32 (same precedent as doctor.test.ts).
# =============================================================================
name: Cross-Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64:
    name: Linux arm64 (full tier + golden path)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full unit suite (parity with Linux x64 — no subset)
        run: bun test
      - name: Golden path
        run: bun run golden-path
        env:
          HOME: /tmp/xr-cross-arm-home
          XR_HOME: /tmp/xr-cross-arm-data

  macos:
    name: macOS arm64 (full tier + golden path)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full unit suite (parity with Linux — no subset)
        run: bun test
      - name: Golden path
        run: bun run golden-path
        env:
          HOME: /tmp/xr-cross-home
          XR_HOME: /tmp/xr-cross-data

  macos-intel:
    name: macOS x64 (full tier + golden path)
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full unit suite (parity with Linux — no subset)
        run: bun test
      - name: Golden path
        run: bun run golden-path
        env:
          HOME: /tmp/xr-cross-home13
          XR_HOME: /tmp/xr-cross-data13

  windows:
    name: Windows x64 (full tier + golden path)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full unit suite (parity with Linux — no subset)
        run: bun test
      - name: Golden path
        run: bun run golden-path
        env:
          HOME: ${{ runner.temp }}\xr-home
          XR_HOME: ${{ runner.temp }}\xr-data

  beta-label:
    name: Support-matrix freshness (matrix must match CI reality)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install (frozen, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: release:check (support matrix + channels stamped from the manifest)
        run: bun run release:check
      - name: Support-matrix test (tiers ⟷ this workflow's jobs)
        run: bun test test/release/support-matrix.test.ts test/release/portability.test.ts
