# =============================================================================
# XR Phase 9 · T4 — Cross-platform CI at FULL parity (macOS + Windows + Linux).
#
# "Supported" means validated — never "imports compile". Every OS family runs
# the SAME three gates from ONE computation source:
#
#   1. typecheck          (bunx tsc --noEmit)
#   2. full unit suite    minus ONLY the documented exclusions in
#                         test/platform/exclusions.json — each with a reason,
#                         each guarded by `platform-parity.ts --validate` so a
#                         test can never vanish silently (Art. XX.4/XX.5).
#                         One additional lane carve-out: test/e2e-blackbox/
#                         is excluded from the parity suite on ALL OSes. Those
#                         suites spawn real CLIs against stub servers and are
#                         owned by dedicated CI lanes: the capture suites run
#                         in `CI / test / e2e-blackbox`, and the F-02/F-03
#                         kill proofs are RED on HEAD until Phase 1 by design
#                         and run only in the advisory `CI / test /
#                         e2e-blackbox-proof` lane. Running them inside the
#                         parity suite would fail every OS lane on HEAD with
#                         the very proofs that must stay red.
#   3. golden path        (hermetic install → answer → restart → resume →
#                          answer → uninstall, asserting real effects)
#
# The support matrix (docs/release/SUPPORT_MATRIX.md) claims exactly what these
# jobs prove — `partial` is never rounded up to `supported`.
# =============================================================================
name: Cross-Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  parity:
    name: ${{ matrix.osName }} — full parity (typecheck + suite + golden path)
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { osName: "Linux (reference)", runsOn: ubuntu-latest, bunOs: linux }
          - { osName: "macOS", runsOn: macos-latest, bunOs: darwin }
          - { osName: "Windows", runsOn: windows-latest, bunOs: win32 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Exclusion manifest validates (no silent skips)
        run: bun run scripts/platform-parity.ts --validate
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Full unit suite for this OS (one computation authority)
        shell: bash
        # Safety net (not the fix): the parity runner already segments + retries
        # crash-class exits. This bound catches a future true hang (e.g. a stuck
        # subprocess) well before the 60-min job limit, with a clear step-level
        # failure. Normal runtime is ~1–6 min per OS.
        timeout-minutes: 30
        run: |
          # ONE computation authority for WHAT runs: scripts/platform-parity.ts.
          # HOW it runs: per-directory segments via scripts/parity-suite-runner.sh.
          # A single 214-file monolithic `bun test` process intermittently dies
          # mid-run on hosted runners (win32 exit 3 at ~85s; linux exit 1 at
          # ~68s — no test-failure output, matching bun-on-Windows crash classes
          # in transpiler/GC/teardown under accumulated load). Fresh process per
          # segment caps heap/lifetime pressure, keeps every gate identical, echoes
          # the segment name before running it, and retries a segment ONCE when it
          # exits non-zero with ZERO test failures (crash class) — a segment with
          # any real test failure fails immediately and prints its full output.
          # The count guard makes a silent skip impossible (Art. XX.4/XX.5):
          # executed files MUST equal the authority's list.
          # test/e2e-blackbox/ is excluded here (see header): the spawn-heavy
          # black-box suites are owned by the dedicated lanes in ci.yml, and
          # the kill proofs are RED on HEAD until Phase 1.
          # Windows: per-test/hook budget 20 s instead of bun's 5 s. Hosted
          # Windows runners are erratic (same test: 75 ms in one run, 2272 ms
          # in the next); the budget is a hang detector, and hangs are still
          # bounded by the runner's 420 s segment watchdog + the step below.
          if [ "${{ matrix.bunOs }}" = "win32" ]; then export XR_TEST_TIMEOUT_MS=20000; fi
          bash scripts/parity-suite-runner.sh ${{ matrix.bunOs }} --exclude '^test/e2e-blackbox/'
      - name: "Hang diagnostics (win32) — name the wedged test"
        if: runner.os == 'Windows' && failure()
        shell: bash
        # If the suite step failed on win32, rerun the two historically
        # wedge-prone files alone with a preload that writes kill-surviving
        # markers (START/END per test + a 2 s heartbeat) — the same harness as
        # .github/workflows/win-lab.yml. A killed bun loses its stdout on
        # win32; the markers do not. Every command is wall-clock bounded:
        # the previous version of this step piped an unbounded `bun test`
        # into `tail` and itself hung for the remaining 29 minutes of the job.
        #
        # Root cause of the original hang (2026-09-19, lab run 35467925776):
        # an approval wait whose only wake-ups were unref'd timers — Bun on
        # win32 does not service those once nothing ref'd remains, and the
        # per-test timeout is the same kind of timer. Fixed in
        # src/control/approval-store.ts (TTL timer ref'd).
        continue-on-error: true
        timeout-minutes: 8
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          cat > "$RUNNER_TEMP/diag/markers.ts" <<'EOF'
          import { afterAll, afterEach, beforeAll, beforeEach } from "bun:test";
          import { appendFileSync } from "node:fs";
          const f = process.env.XR_DIAG_MARKERS ?? "";
          const t0 = Date.now();
          let n = 0;
          const mark = (s: string) => f && appendFileSync(f, `+${((Date.now() - t0) / 1000).toFixed(2)}s ${s}\n`);
          mark(`preload pid=${process.pid}`);
          beforeAll(() => mark("beforeAll"));
          beforeEach(() => { n++; mark(`START #${n}`); });
          afterEach(() => mark(`END   #${n}`));
          afterAll(() => mark("afterAll"));
          const hb = setInterval(() => mark("heartbeat"), 2000);
          (hb as unknown as { unref?: () => void }).unref?.();
          EOF
          for f in test/phase2/approvals-durable.test.ts test/state/migration-lock-self-deadlock.test.ts; do
            m="$RUNNER_TEMP/diag/$(basename "$f").markers"; : > "$m"
            echo "::group::$f alone (120 s wall clock, 20 s/test)"
            XR_DIAG_MARKERS="$m" timeout --signal=TERM --kill-after=10s 120s \
              bun test "$f" --preload "$RUNNER_TEMP/diag/markers.ts" --timeout 20000 > "$RUNNER_TEMP/diag/out.txt" 2>&1
            echo "exit=$? (124 = still wedged)"
            echo "--- markers (a START without END names the wedged test; no heartbeat = loop never ran) ---"
            tail -n 40 "$m"
            echo "--- output tail ---"
            tail -n 40 "$RUNNER_TEMP/diag/out.txt"
            echo "::endgroup::"
            taskkill.exe //F //IM bun.exe //T >/dev/null 2>&1 || true
          done
          echo "::group::leftover migration locks"
          for d in "$XR_HOME" "$HOME/.xr" "$TEMP"; do
            [ -n "$d" ] && [ -d "$d" ] || continue
            find "$d" -maxdepth 3 -name '*.migrate.lock' -printf '%p  %s bytes\n' 2>/dev/null || true
          done
          echo "::endgroup::"
      - name: Golden path (hermetic)
        shell: bash
        timeout-minutes: 10
        run: bun run golden-path
        env:
          HOME: /tmp/xr-cross-${{ matrix.bunOs }}-home
          XR_HOME: /tmp/xr-cross-${{ matrix.bunOs }}-data
