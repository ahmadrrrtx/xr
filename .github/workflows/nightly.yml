# =============================================================================
# XR Phase 1 · T6 — Nightly golden path (Linux + container)
#
# Every night: run the full golden path (install → verify → first answer →
# restart → resume → second answer → uninstall) twice:
#   1. directly on the Linux runner;
#   2. inside the XR container image (proves the shipped image carries a
#      working, durable runtime — the dashboard is not the only surface).
# Failures emit the FAIL <step>: <reason> diagnostics from golden-path.ts.
# =============================================================================
name: Nightly Golden Path

on:
  schedule:
    - cron: "23 2 * * *" # 02:23 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-path-linux:
    name: Golden path (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run golden path
        run: bun run golden-path
        env:
          HOME: /tmp/xr-nightly-home
          XR_HOME: /tmp/xr-nightly-data

  golden-path-container:
    name: Golden path (container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t xr:nightly .

      - name: Run golden path inside the container
        run: |
          # The image mounts the repo as the workdir with the data volume at
          # /data; golden-path runs the CLI + runtime against a hermetic home.
          docker run --rm \
            -e HOME=/tmp/xr-home \
            -e XR_HOME=/tmp/xr-data \
            -v "$PWD":/app \
            -w /app \
            xr:nightly bun run scripts/golden-path.ts

  # ── Phase 8 · T4 ────────────────────────────────────────────────────────────
  # First-task success-rate survey: 20 fresh-machine attempts (install → boot
  # → first answer) must succeed at ≥ 95%. Automated proxy — the human study
  # stays pending per docs/ux/FIRST-TASK.md (honesty exception E-1); this job
  # guards the machine-verifiable half of the requirement.
  first-task-survey:
    name: First-task survey (N=20, rate ≥ 0.95)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun (packageManager-pinned)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run first-task survey
        run: |
          bun run scripts/first-task-survey.ts --runs=20 --target=0.95 --json | tee first-task-survey.json

      - name: Upload survey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-task-survey
          path: first-task-survey.json
          retention-days: 90

  # ── Phase 9 · T6 — Public-Beta install-success metric ────────────────────
  # Installs XR via the real installer on every tier-1 OS family, records the
  # attempt, and aggregates the rolling window honestly: the >99% claim opens
  # only once ≥ 30 recorded attempts exist (scripts/beta-metric.ts gate). The
  # history is carried by a best-effort CI cache (artifacts are the durable
  # audit trail; a cache miss simply means a provisional window).
  beta-install:
    name: Beta install success (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout (beta-metric script lives here)
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Resolve OS label
        id: os
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-*) echo "label=linux" >> "$GITHUB_OUTPUT" ;;
            macos-*) echo "label=macos" >> "$GITHUB_OUTPUT" ;;
            windows-*) echo "label=windows" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Restore metric history (best-effort; artifacts are the audit trail)
        uses: actions/cache@v4
        with:
          path: .beta-metrics
          key: beta-metrics-${{ steps.os.outputs.label }}
          restore-keys: |
            beta-metrics-${{ steps.os.outputs.label }}-
      - name: Run the Public-Beta installer (hermetic home)
        shell: bash
        env:
          XR_HOME: ${{ runner.temp }}/xr-beta-install
          HOME: ${{ runner.temp }}/xr-beta-home
          XR_DATA_HOME: ${{ runner.temp }}/xr-beta-data
        run: |
          set -uo pipefail
          mkdir -p .beta-metrics
          OK=0
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -Command \
              "iex \"& { \$(irm https://raw.githubusercontent.com/ahmadrrrtx/xr/main/install.ps1) } -Yes\"" && OK=1 || OK=0
          else
            curl -fsSL https://raw.githubusercontent.com/ahmadrrrtx/xr/main/install.sh | bash -s -- --yes && OK=1 || OK=0
          fi
          echo "OK=$OK" >> "$GITHUB_ENV"
      - name: Record the attempt
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          bun run scripts/beta-metric.ts record \
            --file .beta-metrics/metrics.jsonl --os "${{ steps.os.outputs.label }}" \
            --channel installer --version "$(node -p 'JSON.parse(require("fs").readFileSync("release.manifest.json","utf8")).identity.version')" \
            --ok "${OK:-0}" --job-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Rolling gate + report (provisional until the window is full)
        shell: bash
        if: always()
        run: |
          bun run scripts/beta-metric.ts report --file .beta-metrics/metrics.jsonl --window 30 >> "$GITHUB_STEP_SUMMARY"
          # Gate: fails the job once the window is full and < 99%; provisional
          # runs report and pass (recorded, never claimed).
          bun run scripts/beta-metric.ts gate --file .beta-metrics/metrics.jsonl --threshold 0.99 --window 30 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload metric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-install-${{ steps.os.outputs.label }}
          path: .beta-metrics/metrics.jsonl
          retention-days: 400
