# =============================================================================
# XR Preview 1 — Windows evidence (plan section 13, task T60)
#
# The agent's Linux box cannot run Windows, so every Windows claim in the
# Preview 1 readiness report must come from a GitHub-hosted Windows runner
# (owner decision, section 10/D2). Wine is never evidence.
#
# What this workflow establishes, in order:
#   1. build the CLI exe for Windows and install it where the installer would
#   2. CLI truth: --version, doctor, env capabilities --json
#   3. one-shot task against a loopback mock provider that writes a file, plus
#      workspace path-escape denials (..\ , UNC, drive letter, junction)
#   4. sandbox tiers: what the runner actually has (docker info), the
#      experimental AppContainer path, and the D5 refusal when no sandbox exists
#   5. the repository's own Windows-only Rust tests (shell-test-windows)
#   6. installers: attempt to reuse desktop-app.yml artifacts; NOT RUN and said
#      so plainly when they are absent rather than quietly skipped
#   7. every log and screenshot uploaded as an artifact
#
# Steps that cannot run are reported as NOT RUN / BLOCKED in the step summary.
# Nothing here is allowed to turn an absent result into a PASS.
# =============================================================================
name: Windows Preview Test

on:
  workflow_dispatch:
  push:
    branches: [release/preview-1]

permissions:
  contents: read
  actions: read

concurrency:
  group: win-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1-4. CLI truth, path escapes, sandbox policy ───────────────────────────
  cli:
    name: Windows CLI (x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun (repo pin)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      # 1. Build the Windows CLI exe with the repo's ONE computation source
      #    (scripts/compile-sidecar.ts), which is also what desktop-app.yml ships.
      #    T60.a: the hand-rolled `bun build --compile` here lacked
      #    --external playwright --external playwright-core and failed on
      #    chromium-bidi on a real Windows runner (run 42703322271).
      - name: Build xr.exe (scripts/compile-sidecar.ts)
        shell: bash
        env:
          SIDECAR_TRIPLE: x86_64-pc-windows-msvc
        run: |
          set -euo pipefail
          mkdir -p out
          bun run scripts/compile-sidecar.ts
          cp desktop/src-tauri/binaries/xr-engine-x86_64-pc-windows-msvc.exe out/xr.exe
          ls -l out/xr.exe

      # 2. CLI truth.
      - name: CLI truth (--version, doctor, env capabilities)
        shell: bash
        run: |
          set -uo pipefail
          ./out/xr.exe --version || echo "EXIT_VERSION=$?"
          echo "--- doctor ---"
          ./out/xr.exe doctor || echo "EXIT_DOCTOR=$?"
          echo "--- env capabilities --json ---"
          ./out/xr.exe env capabilities --json > env-capabilities.json || echo "EXIT_CAPS=$?"
          head -c 2000 env-capabilities.json || true

      # 3. THE SMOKE LANE (T12) — the same script that runs on Linux, against the
      #    compiled Windows exe. Real provider path via a loopback mock (keyless
      #    ollama preset), real approval gate, real isolation report for THIS host.
      - name: Release smoke (scripts/release-smoke/run-all.sh, XR_BIN=out/xr.exe)
        shell: bash
        run: |
          set -uo pipefail
          export XR_BIN="$PWD/out/xr.exe"
          export TMPDIR="$RUNNER_TEMP"
          bash scripts/release-smoke/run-all.sh 2>&1 | tee smoke.log
          # tee hides the real status; re-derive it from the summary line so a
          # FAIL can never be swallowed by the pipe.
          grep -q "RESULT: PASS" smoke.log || { echo "::error::release smoke did not pass"; exit 1; }

      # 4. PATH-ESCAPE POLICY — run the repository's own escape tests ON WINDOWS.
      #    An earlier version of this workflow "tested" escapes by running
      #    `xr "read the file ..\..\Windows\win.ini"` and treating ANY non-zero
      #    exit as a denial. It was a false pass: with no provider configured the
      #    CLI died at provider preflight, so all four "denials" proved nothing
      #    (run 42705917814, escape-summary's four logs all read
      #    "No coding CLI provider ... was detected"). The policy itself is unit-tested
      #    here instead, natively, where it actually runs.
      - name: Workspace path-escape policy (native Windows unit tests)
        shell: bash
        run: |
          set -uo pipefail
          bun test test/security/filesystem-authority.test.ts \
                   test/security/filesystem-implicit.test.ts \
                   test/security/filesystem-index-context.test.ts \
                   test/security/canonical-bypass.test.ts 2>&1 | tee escape-tests.log
          grep -qE "^ *[0-9]+ fail$| 0 fail" escape-tests.log || { echo "::error::escape tests did not report a result"; exit 1; }
          grep -qE " 0 fail" escape-tests.log || { echo "::error::escape policy tests failed on Windows"; exit 1; }

      - name: Direct host automation refusal (native Windows)
        shell: bash
        run: |
          set -euo pipefail
          bun test test/security/desktop-control-policy.test.ts test/trust/canonical-shell-isolation.test.ts 2>&1 | tee desktop-control-refusal.log

      # 5. Sandbox tiers — recorded honestly, not asserted.
      - name: Sandbox tiers (recorded, not claimed)
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "## Windows sandbox availability (recorded)"
            echo
            echo '```'
            docker version 2>&1 | head -20 || echo "docker: NOT PRESENT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- docker info ---"; docker info 2>&1 | head -30 || true

      # 6. The experimental AppContainer path: capability report only. Whether it
      #    is a boundary is decided by the guarantee matrix in the smoke lane above,
      #    which reads "fail closed" on a host that cannot provide one.
      - name: Experimental AppContainer sandbox (capabilities only)
        shell: bash
        run: |
          set -uo pipefail
          export XR_HOME="$RUNNER_TEMP/xrhome"
          mkdir -p "$XR_HOME"
          export XR_OS_SANDBOX=experimental
          ./out/xr.exe env capabilities --json > appcontainer.json || echo "EXIT=$?"
          head -c 1200 appcontainer.json || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cli-logs
          path: |
            *.log
            *.json
          if-no-files-found: warn
          retention-days: 14

  # ── 5. The repo's own Windows-only Rust tests ──────────────────────────────
  rust-windows:
    name: Rust Windows tests (shell-test-windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Setup Bun (repo pin)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install engine dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      # T60.a: build.rs calls tauri_build::try_build, which VALIDATES that
      # bundle.externalBin exists. A from-scratch `cargo test` therefore failed
      # with "resource path binaries\xr-engine-x86_64-pc-windows-msvc.exe
      # doesn't exist" until the sidecar is compiled — exactly what
      # desktop-app.yml's shell-test-windows job already does.
      - name: Compile engine sidecar (x86_64-pc-windows-msvc)
        env:
          SIDECAR_TRIPLE: x86_64-pc-windows-msvc
        run: bun run scripts/compile-sidecar.ts
      - name: cargo test (desktop shell)
        working-directory: desktop/src-tauri
        timeout-minutes: 45
        env:
          RUSTFLAGS: -D warnings
        shell: pwsh
        run: |
          cargo test --locked --jobs 1 --lib -- --nocapture 2>&1 | Tee-Object -FilePath cargo-test.log
          $cargoExit = $LASTEXITCODE
          if ($cargoExit -ne 0) { exit $cargoExit }
      - name: Upload cargo log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-cargo-test-log
          path: desktop/src-tauri/cargo-test.log
          if-no-files-found: warn
          retention-days: 14

  # ── 6-7. Installers: reuse desktop-app.yml artifacts or say NOT RUN ───────
  installers:
    name: Installers (msi / nsis) — inspect if present
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Look for desktop-app.yml Windows artifacts
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p artifacts
          # Reuse the packaging lane's output instead of rebuilding the Tauri shell here.
          RUN_ID=$(curl -s -K <(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN") \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/desktop-app.yml/runs?branch=${GITHUB_REF_NAME}&per_page=1" \
            | grep -o '"id": [0-9]*' | head -1 | grep -o '[0-9]*' || true)
          echo "run_id=${RUN_ID:-none}" >> "$GITHUB_OUTPUT"
          if [ -z "${RUN_ID:-}" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No desktop-app.yml run for this branch yet — installer steps are NOT RUN, not skipped silently."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Found desktop-app.yml run $RUN_ID"

      - name: Download Windows artifacts
        if: steps.find.outputs.found == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          curl -sL -K <(printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN") \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.find.outputs.run_id }}/artifacts" \
            -o artifacts.json || true
          head -c 3000 artifacts.json || true

      - name: Installer steps BLOCKED (installation not implemented)
        if: always()
        shell: bash
        run: |
          {
            echo "## Installers: NOT RUN"
            echo
            echo "An artifact metadata lookup, whether successful or not, is not an installation test."
            echo "Silent install, installed-app launch and authenticated sidecar health, data retention,"
            echo "and uninstall assertions have NOT RUN. A real current-SHA installer test is required."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Windows installer lifecycle verification BLOCKED — no install was executed"
          exit 1
