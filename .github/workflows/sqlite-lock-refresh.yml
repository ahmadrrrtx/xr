# One-shot release-branch evidence job for T11.b. It cannot push, publish, or
# access signing credentials. Cargo generates both the manifest and lockfile;
# the release engineer reviews and commits the output before native validation.
name: Preview SQLite lock refresh
on:
  push:
    branches: [release/preview-1]
    paths: [.github/workflows/sqlite-lock-refresh.yml]
permissions:
  contents: read
jobs:
  refresh:
    name: Generate SQLite fix candidate (not a desktop build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: Bump manifest and generate lock with Cargo
        working-directory: desktop/src-tauri
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          old_version = 'rust-version = "1.77"'
          old_dep = 'rusqlite = { version = "0.37", features = ["bundled"] }'
          assert s.count(old_version) == 1 and s.count(old_dep) == 1
          s = s.replace(old_version, 'rust-version = "1.89"')
          s = s.replace(old_dep, 'rusqlite = { version = "0.41", features = ["bundled"] }')
          p.write_text(s)
          PY
          cargo update -p rusqlite --precise 0.41.1
          cargo tree --locked -i libsqlite3-sys | tee sqlite-lock-refresh-evidence.txt
          grep -A 2 '^name = "libsqlite3-sys"$' Cargo.lock
      - name: Upload candidate for review (not a release artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-sqlite-lock-candidate
          if-no-files-found: error
          path: |
            desktop/src-tauri/Cargo.toml
            desktop/src-tauri/Cargo.lock
            desktop/src-tauri/sqlite-lock-refresh-evidence.txt
