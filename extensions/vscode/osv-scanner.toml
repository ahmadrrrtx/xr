# osv-scanner policy for extensions/vscode/package-lock.json (Supply Chain workflow).
#
# Same discipline as website/osv-scanner.toml: every ignore names its evidence and
# EXPIRES, so it is re-argued rather than forgotten.
#
# EMPTY ON PURPOSE (2026-10-27): the only entry here was GHSA-vfj7-8cjw-p6xm
# (braces <=3.0.3 stack exhaustion). The advisory was WITHDRAWN upstream on
# 2026-10-23, so osv-scanner no longer reports it and now fails the scan for an
# unused ignore. Re-add an [[IgnoredVulns]] block only with a live advisory id,
# an expiry date and the reason the finding is not reachable.

# ── 2026-10-27 CI gate finding (published 2026-10-23) ────────────────────────
# The advisory's fix (msal-node 7.1.0) is a MAJOR bump; the locked 5.x copy is
# what @azure/identity's current release range asks for, and @azure/identity is
# only reached through @vscode/vsce (the packaging tool, a devDependency). It is
# never bundled into the .vsix and never ships to a user; the affected flow is
# the packaging account's interactive browser login, not extension code. Remove
# when @vscode/vsce moves to an @azure/identity that accepts msal-node 7.

[[IgnoredVulns]]
id = "GHSA-xcx6-jx8p-x3h5"
ignoreUntil = 2027-01-31
reason = "@azure/msal-node 5.6.0 — authorization-code flow parameter disclosure, fixed in 7.1.0 (major). Pulled only by @azure/identity <- @vscode/vsce (devDependency, packaging tool). No msal code is bundled into the .vsix and no extension code path calls it; the exposure is confined to the publisher's local `vsce` login. Major-bump tracking is upstream (@vscode/vsce -> @azure/identity range). Re-argue at expiry."

# ── 2026-11-01 CI gate findings (advisories published after 2026-10-29) ──────
# glob 13.0.6 and minimatch 10.2.6 are both transitive devDependencies of
# @vscode/vsce (the .vsix PACKAGING tool run by the developer/publisher, not
# the extension): the advisory paths operate on the publisher's local file
# tree during packaging. Nothing from vsce is bundled into the .vsix.

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2027-02-28
reason = "glob 13.0.6 (GHSA-3g3m-2fjr-6pw4) — AbortSignal cancellation bypass allows post-timeout filesystem traversal, fixed only in the 14.0.2 major. Transitive devDependency of @vscode/vsce (the .vsix packaging tool); the traversal happens on the publisher's local tree during packaging, and no vsce code is bundled into the extension. No in-range fixed version for the vsce chain. Re-argue at expiry."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-28
reason = "minimatch 10.2.6 (GHSA-g3hv-75wg-m249) — potential DoS via globparts amplification, fixed only in the 11.0.1 major (advisory range: every version below 11.0.1). Transitive devDependency of @vscode/vsce (the .vsix packaging tool) via its glob chain; exposure is packaging-time over the publisher's own tree, with nothing bundled into the extension. No in-range fix exists for the vsce chain's pins. Re-argue at expiry."

