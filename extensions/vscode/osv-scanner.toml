# osv-scanner policy for extensions/vscode/package-lock.json (Supply Chain workflow).
#
# Same discipline as website/osv-scanner.toml: the ignore names its evidence and
# EXPIRES, so it is re-argued rather than forgotten.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-31
reason = "braces <=3.0.3 stack-exhaustion DoS via deeply nested patterns (CVE-2026-93687). No fixed release on npm as of 2026-10-10 (3.0.3 is latest). Reached only through @vscode/vsce (packaging tool, devDependency) -> secretlint -> globby -> fast-glob -> micromatch. It is not bundled into the .vsix, and no untrusted input reaches the pattern strings. Remove when vsce drops that chain or braces ships a fix; re-argue at expiry."
