<!doctype html>
<html lang="en" data-theme="xr-native">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>XR</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#03070D" />
    <!-- Apply the persisted theme before first paint (CSP-safe: same-origin script). -->
    <script src="/theme-init.js"></script>
    <!-- First-paint fonts: Inter (UI) + Orbitron (wordmark). JetBrains Mono swaps in lazily. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/orbitron-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
