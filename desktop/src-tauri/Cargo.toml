[package]
name = "xr-desktop"
version = "0.1.0"
description = "XR Desktop — Tauri v2 shell over the XR engine daemon"
authors = ["Muhammad Ahmad (@ahmadrrrtx)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
