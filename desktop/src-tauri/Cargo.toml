[package]
name = "xr-desktop"
version = "0.1.0"
description = "XR Desktop — Tauri v2 shell over the XR engine daemon"
authors = ["Muhammad Ahmad (@ahmadrrrtx)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Phase 5 · native matrix (reference builds; validated by CI cargo check/clippy):
# OS notifications, opt-in autostart, and the signed updater (inert until the
# operator provisions endpoints + pubkey — see docs/release/UPDATER.md).
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
# W-3 · one shell per session WITH focus-existing: a second launch hands its
# argv to the running shell (named mutex + WM_COPYDATA on Windows, D-Bus on
# Linux) and exits. Registered first in lib.rs.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SEC-12 · Unix sidecar containment (PR_SET_PDEATHSIG on Linux, SIGTERM-first
# shutdown on every Unix). Already in the dependency graph via tauri; this
# makes it a direct, declared use.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
