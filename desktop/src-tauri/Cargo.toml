[package]
name = "xr-desktop"
version = "0.2.0"
description = "XR Desktop — Tauri v2 shell for the XR agent (the AI agent you can actually trust)"
authors = ["Muhammad Ahmad (@ahmadrrrtx)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "xr_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

# ── XR production plugin matrix (docs/DEEP-DIVE-ARCHITECTURE.md §A.1) ──
# All wired now so later phases only add capabilities + frontend calls.
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-updater = "2"

# Phase 3 — hardware detection (sysinfo) + localhost Ollama HTTP probes
# (ureq, blocking, rustls — deliberately not reqwest/tokio).
sysinfo = "0.33"
ureq = { version = "2", features = ["json", "tls"] }

# Phase 4 — chat persistence (SQLite, WAL; bundled build so no system sqlite needed).
rusqlite = { version = "0.37", features = ["bundled"] }

# Stronghold key derivation (Argon2id) — see src/lib.rs `key_derivation`.
argon2 = "0.5"
# `tauri::generate_context!` requires serde/serde_json as direct dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
