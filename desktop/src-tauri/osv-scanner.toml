# osv-scanner policy for the Tauri shell's Cargo.lock (Supply Chain workflow).
#
# Same rule as the previous shell's policy (see legacy/desktop-v2): every entry
# is a TRANSITIVE dependency with no fix reachable from this crate, each ignore
# names its evidence and EXPIRES, so it is re-argued rather than forgotten.
#
# Phase 0 plugin matrix context (docs/DEEP-DIVE-ARCHITECTURE.md §A.1): the
# gtk findings are inherited from tauri's Linux stack (unchanged from the
# legacy shell). The never-used stronghold plugin was removed post-v1 (audit
# finding 029) — 86 crates left the lock, retiring its bincode/paste ignores
# (RUSTSEC-2025-0141 / RUSTSEC-2024-0436) and the zip 8.6.0 copy. Phase 4
# removed the unused tauri-plugin-sql (sqlx) in favor of rusqlite — that also
# removed the rsa/sqlx-mysql transitive set, so the RUSTSEC-2023-0071 ignore
# retired with it (osv-scanner fails on unused ignores, by design).
#
# Re-check on every Tauri bump:  osv-scanner -r --format table desktop/src-tauri

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-31
reason = "(alias GHSA-wrw7-89jp-8q8g) glib 0.18.5 `VariantStrIter` unsound impls (fixed in glib 0.20). Pulled by gtk 0.18 <- tauri 2 on Linux; XR never touches VariantStrIter. Fix requires Tauri moving to gtk-rs 0.20 — track tauri-apps/tauri, re-evaluate at expiry. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-31
reason = "proc-macro-error is unmaintained (compile-time proc-macro only, no runtime code). Pulled by glib-macros/gtk3-macros 0.18 <- tauri 2 on Linux. (Carried over from the legacy shell's policy.)"

# ── PR #188 CI gate findings (published 2026-10-09/10/16) ─────────────────────
# zip: extraction-side advisories with a fix upstream (9.0.0), but the locked
# copy cannot move independently of Tauri — tauri-plugin-updater declares
# `zip ^4` through the CURRENT latest stable (2.14.0). (The former zip 8.6.0
# copy came via libsodium-sys-stable <- the stronghold chain; gone with 029.)
# XR's single direct extract() face is settings.rs import_all_data (the
# user-picked export zip) — tracked for the zip 9 migration when the updater
# chain moves; the updater's own extraction sits behind its signature gate.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
ignoreUntil = 2027-02-15
reason = "zip 4.6.1 — extraction preserves SUID/SGID bits (fixed in zip 9.0.0). Locked copy: tauri-plugin-updater declares zip ^4 through latest stable 2.14.0 (extraction behind the updater's signature-verification gate). XR's only in-app extract() face (settings.rs import_all_data) runs as the unprivileged user over a user-picked archive — no SUID-capable execution context; zip 9 migration tracked with the updater chain. Re-argue at expiry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
ignoreUntil = 2027-02-15
reason = "zip 4.6.1 — extract() creates symlinks whose targets escape the destination (fixed in zip 9.0.0). Same owner as RUSTSEC-2026-0367: updater-side extraction is signature-gated; XR's import path (settings.rs) is the sole in-app extract surface — tracked for zip 9 when tauri-plugin-updater moves off ^4. Re-argue at expiry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2027-02-15
reason = "zip 4.6.1 (CVSS 9.1) — permissions applied through extracted symlinks without confinement (fixed in zip 9.0.0). Same owner/tracking as RUSTSEC-2026-0367; the signature gate covers the updater path, and the settings import path is the tracked in-app face. Re-argue at expiry."

