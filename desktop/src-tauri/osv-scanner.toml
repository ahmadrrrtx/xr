# removed the rsa/sqlx-mysql transitive set, so the RUSTSEC-2023-0071 ignore
# retired with it (osv-scanner fails on unused ignores, by design).
#
# Re-check on every Tauri bump:  osv-scanner -r --format table desktop/src-tauri

