# osv-scanner policy for the Tauri shell's Cargo.lock (Supply Chain workflow).
#
# Same rule as the previous shell's policy (see legacy/desktop-v2): every entry
# is a TRANSITIVE dependency with no fix reachable from this crate, each ignore
# names its evidence and EXPIRES, so it is re-argued rather than forgotten.
#
# Phase 0 plugin matrix context (docs/DEEP-DIVE-ARCHITECTURE.md §A.1): the
# stronghold plugin widened the graph; the gtk findings are inherited from
# tauri's Linux stack (unchanged from the legacy shell). Phase 4 removed the
# unused tauri-plugin-sql (sqlx) in favor of rusqlite — that also removed the
# rsa/sqlx-mysql transitive set, so the RUSTSEC-2023-0071 ignore retired with
# it (osv-scanner fails on unused ignores, by design).
#
# Re-check on every Tauri bump:  osv-scanner -r --format table desktop/src-tauri

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-31
reason = "(alias GHSA-wrw7-89jp-8q8g) glib 0.18.5 `VariantStrIter` unsound impls (fixed in glib 0.20). Pulled by gtk 0.18 <- tauri 2 on Linux; XR never touches VariantStrIter. Fix requires Tauri moving to gtk-rs 0.20 — track tauri-apps/tauri, re-evaluate at expiry. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-31
reason = "proc-macro-error is unmaintained (compile-time proc-macro only, no runtime code). Pulled by glib-macros/gtk3-macros 0.18 <- tauri 2 on Linux. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
