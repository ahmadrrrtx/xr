# osv-scanner policy for the Tauri shell's Cargo.lock (Supply Chain workflow).
#
# Same rule as the previous shell's policy (see legacy/desktop-v2): every entry
# is a TRANSITIVE dependency with no fix reachable from this crate, each ignore
# names its evidence and EXPIRES, so it is re-argued rather than forgotten.
#
# Phase 0 plugin matrix context (docs/DEEP-DIVE-ARCHITECTURE.md §A.1): the
# gtk findings are inherited from tauri's Linux stack (unchanged from the
# legacy shell). The never-used stronghold plugin was removed post-v1 (audit
# finding 029) — 86 crates left the lock, retiring its bincode/paste ignores
# (RUSTSEC-2025-0141 / RUSTSEC-2024-0436) and the zip 8.6.0 copy. Phase 4
# removed the unused tauri-plugin-sql (sqlx) in favor of rusqlite — that also
# removed the rsa/sqlx-mysql transitive set, so the RUSTSEC-2023-0071 ignore
# retired with it (osv-scanner fails on unused ignores, by design).
#
# Re-check on every Tauri bump:  osv-scanner -r --format table desktop/src-tauri

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-31
reason = "(alias GHSA-wrw7-89jp-8q8g) glib 0.18.5 `VariantStrIter` unsound impls (fixed in glib 0.20). Pulled by gtk 0.18 <- tauri 2 on Linux; XR never touches VariantStrIter. Fix requires Tauri moving to gtk-rs 0.20 — track tauri-apps/tauri, re-evaluate at expiry. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-31
reason = "proc-macro-error is unmaintained (compile-time proc-macro only, no runtime code). Pulled by glib-macros/gtk3-macros 0.18 <- tauri 2 on Linux. (Carried over from the legacy shell's policy.)"

# ── PR #188 CI gate findings (published 2026-10-09/10/16) ─────────────────────
# (2026-11-25) The zip family is retired from this file. RUSTSEC-2026-0367,
# RUSTSEC-2026-0368, RUSTSEC-2026-0369, GHSA-m665-v7pm-7grj ("Zip Cloaking"),
# GHSA-8hxf-qr8p-62x4 and GHSA-q7v9-x93c-xqv3 all targeted the locked zip 4.6.1.
# The shell now locks zip 9.8.2 (9.0.5 fixes all six), and tauri-plugin-updater
# is built without its `zip` feature, so nothing pulls zip 4 any more: XR ships
# Tauri v2 updater artifacts, which the updater installs without unpacking. The
# settings import also enforces local/central header consistency on every entry.
# osv-scanner fails on unused ignores, so these entries could not stay.
# test/supply-chain/zip-advisories.test.ts keeps it that way.

# zbus family: unmaintained-notice class (merged upstream into zbus 6.0.0's
# names/wire modules; no vulnerability statement in the advisories). Migration
# is a zbus 6 rework owned by upstream tauri/tauri-plugin deps (Linux side).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-02-15
reason = "zvariant 5.15.0 unmaintained (merged into zbus as its wire module in zbus 6.0.0 — an unmaintained-notice, no vulnerability statement). Pulled by zbus 5.19 <- tauri 2 on Linux; migration requires the zbus 6 line via upstream Tauri. Re-argue at expiry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-02-15
reason = "zbus_names 4.3.4 unmaintained (merged into zbus as its names module in zbus 6.0.0 — notice, no vulnerability statement). Pulled by zbus 5.19 <- tauri 2 on Linux. Re-argue at expiry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-02-15
reason = "zvariant_derive 5.15.0 unmaintained (derive macros provided by zbus 6.0.0 — notice, no vulnerability statement; compile-time derive macro only, no runtime code). Pulled by zbus 5.19 <- tauri 2 on Linux. Re-argue at expiry."

# ── 2026-10-27 CI gate findings (published 2026-08-19 / 2026-10-13) ──────────
# Both are transitive crates reached through tauri 2's stack. Cargo.lock is
# generated by the Rust toolchain lane and is never hand-edited, so a lock-only
# bump is not a defensible fix here; each entry records what a real fix needs.

# (2026-11-01) GHSA-qwgh-2vcv-g2f7 (block-buffer) was retired from this file:
# OS corrected the affected range to 0.11.0–0.12.1, and the locked copy is
# block-buffer 0.10.4 — unaffected, so osv-scanner reported the ignore as
# unused and the scan failed. The digest-1.0 upgrade note below still applies
# if 0.11.x ever enters the lock.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0386"
ignoreUntil = 2027-02-15
reason = "tokio 1.53.1 — AsyncFd constructors violate I/O safety, fixed in 1.53.3. Pulled by tauri 2's async runtime; XR's shell never constructs tokio::io::unix::AsyncFd (no inotify/AsyncFd use in desktop/src-tauri). The lock copy moves with the next `cargo update` in the desktop-rust lane (Cargo.lock is toolchain-generated). Re-argue at expiry."
