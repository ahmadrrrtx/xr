# ── 2026-10-27 CI gate findings (published 2026-08-19 / 2026-10-13) ──────────
# Both are transitive crates reached through tauri 2's stack. Cargo.lock is
# generated by the Rust toolchain lane and is never hand-edited, so a lock-only
# bump is not a defensible fix here; each entry records what a real fix needs.

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-02-15
reason = "block-buffer 0.10.4 — panic corrupts the inline buffer position, fixed only in 0.12.1 (major). The locked copy is what digest 0.10.7 requires (^0.10), and digest 0.10.7 <- sha2 0.10.9 is XR's own audit-chain hashing. Upgrading means moving the digest 1.0 chain across tauri 2's stack; the panic needs a corrupted inline buffer position, which fixed-size SHA-256 input never produces here. Re-argue at expiry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0386"
ignoreUntil = 2027-02-15
reason = "tokio 1.53.1 — AsyncFd constructors violate I/O safety, fixed in 1.53.3. Pulled by tauri 2's async runtime; XR's shell never constructs tokio::io::unix::AsyncFd (no inotify/AsyncFd use in desktop/src-tauri). The lock copy moves with the next `cargo update` in the desktop-rust lane (Cargo.lock is toolchain-generated). Re-argue at expiry."
