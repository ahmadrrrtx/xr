# osv-scanner policy for the Tauri shell's Cargo.lock (Supply Chain workflow).
#
# Same rule as the previous shell's policy (see legacy/desktop-v2): every entry
# is a TRANSITIVE dependency with no fix reachable from this crate, each ignore
# names its evidence and EXPIRES, so it is re-argued rather than forgotten.
#
# Phase 0 plugin matrix context (docs/DEEP-DIVE-ARCHITECTURE.md §A.1): the
# stronghold + sql plugins widened the graph; the gtk findings are inherited
# from tauri's Linux stack (unchanged from the legacy shell).
#
# Re-check on every Tauri bump:  osv-scanner -r --format table desktop/src-tauri

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2026-12-31
reason = "(alias GHSA-wrw7-89jp-8q8g) glib 0.18.5 `VariantStrIter` unsound impls (fixed in glib 0.20). Pulled by gtk 0.18 <- tauri 2 on Linux; XR never touches VariantStrIter. Fix requires Tauri moving to gtk-rs 0.20 — track tauri-apps/tauri, re-evaluate at expiry. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
ignoreUntil = 2026-12-31
reason = "proc-macro-error is unmaintained (compile-time proc-macro only, no runtime code). Pulled by glib-macros/gtk3-macros 0.18 <- tauri 2 on Linux. (Carried over from the legacy shell's policy.)"

[[IgnoredVulns]]
id = "RUSTSEC-2025-0141"
ignoreUntil = 2026-12-31
reason = "bincode 1.3.3 unmaintained notice (no fixed release; bincode 2 is a different API). Pulled by iota_stronghold <- tauri-plugin-stronghold 2.4. Stronghold is initialized in Phase 0 but stores no secrets yet; no untrusted input reaches bincode deserialization. Re-evaluate at expiry or when stronghold ships bincode 2."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2026-12-31
reason = "paste 1.0.15 unmaintained notice (compile-time macro only, no runtime code). Pulled by stronghold_engine <- iota_stronghold <- tauri-plugin-stronghold 2.4."

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-12-31
reason = "rsa 0.9.10 timing (Marvin) attack — no fixed release in the 0.9 line. Pulled by sqlx-mysql <- sqlx <- tauri-plugin-sql 2.5. XR uses the plugin in SQLite mode ONLY (tauri.conf/Cargo feature 'sqlite'); the MySQL wire codec and its rsa handshake are compiled but never executed. Re-evaluate at expiry or on a sqlx release with rsa 0.9.11+/rsa-fips."
